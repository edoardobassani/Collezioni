<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collezioni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F5F2;--card:#FFFFFF;--line:#E2E2DC;--line2:#EEEEE9;--ink:#17181C;--muted:#5F636B;--acc:#2F5D50;--accbg:#EEF2EF;--up:#1D6B47;--down:#8F3A14;--warnbg:#FBEEE6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:var(--acc)}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 110px}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
h2{margin:0;font-size:15px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}
.xs{font-size:11px}
.b{font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px 16px}
.list>*+*{border-top:1px solid var(--line2)}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;background:none;border:none;text-align:left;cursor:pointer}
.li:hover{background:#FAFAF8}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:38px;height:38px;border-radius:10px;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.ico.solid{background:var(--acc);color:#fff}
.ico.sm{width:32px;height:32px;border-radius:9px}
.ico img{width:100%;height:100%;object-fit:cover}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid #D4D4CE;background:#fff;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:var(--down)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.btn.full{width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:none;background:none;border-radius:12px;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:#ECECE7}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid #D4D4CE;background:#fff;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.seg{display:grid;gap:4px;padding:4px;background:#E9E9E4;border-radius:12px}
.seg button{height:38px;border:none;border-radius:9px;background:transparent;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
label.f{display:flex;flex-direction:column;gap:6px}
label.f>span{font-size:12px;font-weight:500;color:var(--muted)}
.in{height:46px;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 14px;outline:none}
textarea.in{height:auto;min-height:80px;padding:12px 14px;resize:vertical}
.in:focus{border-color:var(--acc)}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--muted)}
.search input{border:none;outline:none;background:transparent;flex:1;min-width:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;font-size:14px}
.kv>span:first-child{color:var(--muted)}
.kv>span:last-child{text-align:right}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--accbg);color:var(--up);white-space:nowrap}
.badge.warn{background:var(--warnbg);color:var(--down)}
.badge.amber{background:#FFF4D6;color:#7A5A00}
.badge.grey{background:#F0F0EC;color:var(--muted)}
.photo{height:220px;border-radius:14px;background:#E9ECE9;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted)}
.photo img{width:100%;height:100%;object-fit:contain;background:#E9ECE9}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:72px;height:72px;border-radius:10px;overflow:hidden;background:#E9ECE9;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:12px;border:none;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.drop{position:relative;display:flex;align-items:center;gap:14px;padding:16px;background:#fff;border:1px dashed #B9BAB3;border-radius:14px;cursor:pointer}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:5}
.nav>div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 0 calc(10px + env(safe-area-inset-bottom))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center;border:none;background:none;font-size:11px;color:var(--muted);cursor:pointer}
.nav button.on{color:var(--acc);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(23,24,28,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:12px 18px calc(24px + env(safe-area-inset-bottom))}
.grab{width:40px;height:4px;border-radius:2px;background:#C9C9C3;margin:0 auto 10px}
.dialog{background:#fff;border-radius:16px;max-width:400px;width:calc(100% - 32px);margin:auto auto;padding:20px}
.overlay.center{align-items:center}
#toast{pointer-events:none;position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;display:none}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.spark{width:100%;height:56px;display:block}
.progress{height:6px;background:#E9E9E4;border-radius:3px;overflow:hidden}
.progress>div{height:100%;background:var(--acc);transition:width .3s}
.sect{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
.handle{display:flex;flex-direction:column}
.tag{font-size:12px;color:var(--muted);padding:3px 8px;background:#F2F2EE;border-radius:8px}
.notice{padding:12px 14px;border-radius:12px;background:var(--accbg);color:var(--acc);font-size:13px}
.notice.warn{background:var(--warnbg);color:var(--down)}
.hidden{display:none!important}
.fileov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:2}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="empty">Caricamento della collezione…</div></div></div>
<input id="pick_cam" type="file" accept="image/*" capture="environment" data-change="picked" tabindex="-1" aria-hidden="true" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0">
<input id="pick_file" type="file" accept=".csv,.xlsx,.txt,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" data-change="ixFile" tabindex="-1" aria-hidden="true" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0">
<input id="pick_gal" type="file" accept="image/*" multiple data-change="picked" tabindex="-1" aria-hidden="true" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0">
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>

function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function uid(p = "i") { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function nowIso() { return new Date().toISOString(); }

function eur(n) {

function migrateConfig() {
  const cfg = S.config; if (!cfg || S._migrating) return;
  let changed = false;
  const copy = JSON.parse(JSON.stringify(cfg));
  if (!copy.gradedAdded) {
    copy.gradedAdded = true; changed = true;
    if (!copy.groups.some(g => g.id === GRADED_PRESET.group.id)) copy.groups.push(JSON.parse(JSON.stringify(GRADED_PRESET.group)));
    GRADED_PRESET.cats.forEach(c => { if (!copy.cats.some(x => x.id === c.id)) copy.cats.push(JSON.parse(JSON.stringify(c))); });
  }
  if (!copy.artAdded) {
    copy.artAdded = true; changed = true;
    if (!copy.groups.some(g => g.id === ART_PRESET.group.id)) copy.groups.push(JSON.parse(JSON.stringify(ART_PRESET.group)));
    ART_PRESET.cats.forEach(c => { if (!copy.cats.some(x => x.id === c.id)) copy.cats.push(JSON.parse(JSON.stringify(c))); });
  }
  copy.cats.forEach(c => {
    if (!c.fields.some(f => f.k === "metallo")) return;

function syncSubs() {
  const ids = new Set((S.config ? S.config.cats : []).map(c => c.id));
  for (const id of Object.keys(S.subs)) if (!ids.has(id)) { S.subs[id](); delete S.subs[id]; delete S.chunks[id]; rebuildItems(id); }
  for (const id of ids) {
    if (S.subs[id]) continue;

      const m = {};
      snap.docs.forEach(d => { m[d.id] = d.data(); });
      S.chunks[id] = m;
      S.loadedCats = S.loadedCats || new Set(); S.loadedCats.add(id);

function rebuildItems(catId) {
  for (const [k, it] of S.items) if (it.catId === catId) S.items.delete(k);

    const its = (doc && doc.items) || {};
    for (const [id, it] of Object.entries(its)) {

  return days.filter(d => d >= from).map(d => ({ d, v: catId ? ((S.hist[d].c || {})[catId] || 0) : S.hist[d].t })).filter(p => p.v != null);

/* Salva più pezzi raggruppandoli per blocco: una scrittura per blocco */
async function saveItems(list) {
  const groups = {};
  const counts = {};
  const moves = [];
  for (const raw of list) {
    const it = Object.assign({}, raw);
    it.updatedAt = nowIso();
    const prev = S.items.get(it.id);
    let chunk = null;
    if (prev && prev.catId === it.catId) chunk = prev._chunk;
    if (prev && prev.catId !== it.catId) moves.push({ catId: prev.catId, chunk: prev._chunk, id: it.id });
    if (!chunk) {
      if (!counts[it.catId]) counts[it.catId] = chunkCounts(it.catId);
      chunk = pickChunk(it.catId, counts[it.catId]);
      counts[it.catId][chunk] = (counts[it.catId][chunk] || 0) + 1;
    }
    const key = it.catId + "/" + chunk;
    (groups[key] = groups[key] || { catId: it.catId, chunk, items: {} }).items[it.id] = cleanItem(it);
  }
  for (const g of Object.values(groups)) {
    await enqueue(async () => {
      const ref = S.db.doc("cats/" + g.catId + "/chunks/" + g.chunk);
      const exists = S.chunks[g.catId] && S.chunks[g.catId][g.chunk];
      if (exists) await ref.update({ items: g.items });
      else await ref.set({ items: g.items });
    });
  }
  for (const m of moves) {
    await enqueue(async () => {
      const doc = S.chunks[m.catId] && S.chunks[m.catId][m.chunk];
      if (!doc) return;
      const items = Object.assign({}, doc.items || {});
      delete items[m.id];
      await S.db.doc("cats/" + m.catId + "/chunks/" + m.chunk).set({ items });
    });
  }
}
async function saveItem(it) { return saveItems([it]); }

function sparkline(hist) {

  const d = pts.map((p, i) => (i ? "L" : "M") + (i / (pts.length - 1) * 320).toFixed(1) + " " + (50 - (p.v - mn) / rg * 42).toFixed(1)).join(" ");
  const up = vs[vs.length - 1] >= vs[0];
  return '<svg class="spark" role="img" aria-label="Andamento del valore, ' + (up ? "in crescita" : "in calo") + '" viewBox="0 0 320 56" preserveAspectRatio="none"><path d="' + d + '" fill="none" stroke="' + (up ? "#2F5D50" : "#8F3A14") + '" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M0 55.5H320" stroke="#E2E2DC"/></svg>';
}

async function saveDraft() {

/* ================= Foto ================= */
async function compressImage(file, max = 1280, q = 0.82) {
  try {
    const bmp = await createImageBitmap(file);
    const r = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas");
    cv.width = Math.round(bmp.width * r); cv.height = Math.round(bmp.height * r);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    return await new Promise(res => cv.toBlob(b => res(b || file), "image/jpeg", q));
  } catch (e) { return file; }
}
/* nell'artifact tengo anche una copia ridotta di ogni foto nel browser: serve a "Copia per l'app"
   anche quando il server delle foto non si lascia rileggere dalla pagina */
const PHC = { db: null };
function phcOpen() {
  if (PHC.db) return PHC.db;
  PHC.db = new Promise((res, rej) => { try { const r = indexedDB.open("col-photo-cache", 1); r.onupgradeneeded = () => r.result.createObjectStore("ph"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } });
  PHC.db.catch(() => { });
  return PHC.db;
}
async function phcSet(id, dataUrl) { try { const db = await phcOpen(); await new Promise((res, rej) => { const t = db.transaction("ph", "readwrite"); t.objectStore("ph").put(dataUrl, id); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) { } }
async function phcGet(id) { try { const db = await phcOpen(); return await new Promise(res => { const t = db.transaction("ph", "readonly"); const q = t.objectStore("ph").get(id); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } }
async function uploadPhoto(file) {
  if (!S.assets) throw new Error("Caricamento foto non disponibile");
  const blob = await compressImage(file);
  const r = await S.assets.upload(blob);
  if (S.env !== "pwa") { try { phcSet(r.id, await blobToDataUrl(await compressImage(blob, 480, 0.65))); } catch (e) { } }
  if (S.env === "pwa") LOCAL.urls.set(r.id, URL.createObjectURL(blob));
  return r.id;
}

const LEVEL_FRAC = { "Piena": 1, "3/4": 0.75, "1/2": 0.5, "1/4": 0.25, "Quasi finita": 0.08, "Finita": 0 };
function levelFrac(l) { return LEVEL_FRAC[l] != null ? LEVEL_FRAC[l] : 1; }
function levelFromFrac(f) { return f >= 0.875 ? "Piena" : f >= 0.625 ? "3/4" : f >= 0.375 ? "1/2" : f >= 0.15 ? "1/4" : "Quasi finita"; }
function bottleCap(it) {
  if (it.capacityMl) return it.capacityMl;
  const f = it.fields && it.fields.formato;
  const m = f && String(f).match(/([\d.,]+)\s*(l|cl|ml)/i);
  if (!m) return null;
  const n = parseNum(m[1]); if (!n) return null;
  const u = m[2].toLowerCase();
  return Math.round(u === "l" ? n * 1000 : u === "cl" ? n * 10 : n);
}
function fmtCl(ml) { if (ml == null || isNaN(ml)) return "—"; const cl = Math.round(ml / 10 * 10) / 10; return String(cl).replace(".", ",") + " cl"; }
function keepExit() {
  const e = S.exit; if (!e) return;
  if ($("x_note")) e.note = val("x_note").trim();
  if ($("x_rating")) e.rating = parseInt(val("x_rating"), 10) || null;
  if ($("x_date")) e.date = val("x_date");
  if ($("x_cl")) e.cl = parseNum(val("x_cl"));
  if ($("x_cap")) { const c = parseNum(val("x_cap")); if (c > 0) { const old = e.cap; e.cap = c * 10; if (e.remFrom === old) e.remFrom = e.cap; } }
}
function exitAfterText() {
  const e = S.exit;
  if (!e.cl || e.cl <= 0) return "Restano " + fmtCl(e.remFrom) + ".";
  const after = Math.max(0, e.remFrom - e.cl * 10);
  return after <= 0 ? "La bottiglia risulterà finita." : "Dopo resteranno " + fmtCl(after) + " (livello " + levelFromFrac(after / e.cap) + ").";
}

function exitCalcHtml() {
  const it = S.items.get(S.exit.id);

  return '<div class="kv"><span>Prezzo d\'acquisto' + (it.buyKind === "stimato" ? " (stimato)" : "") + '</span><span>' + eur(cost) + '</span></div><div class="kv"><span>Incasso netto</span><span>' + eur(net) + '</span></div><div class="kv"><span class="b" style="color:var(--ink)">Guadagno</span><span class="b ' + (g == null ? "" : g >= 0 ? "up" : "down") + '">' + signedEur(g) + '</span></div>';

async function exitSave() {
  const e = S.exit; const it = Object.assign({}, S.items.get(e.id));
  if (e.type === "consumato" && e.levels && e.part) {
    keepExit();
    let mlTo;
    if (e.mode === "cl") {
      if (!e.cl || e.cl <= 0) { toast("Indica quanti cl hai versato."); return; }
      mlTo = Math.max(0, e.remFrom - e.cl * 10);
    } else {
      if (!e.level) { toast("Scegli quanto ne resta."); return; }
      mlTo = e.cap * levelFrac(e.level);
    }
    mlTo = Math.round(mlTo);
    const finished = mlTo <= 0;
    const fromLvl = (it.fields && it.fields.livello) || "Piena";
    const toLvl = finished ? "Finita" : levelFromFrac(mlTo / e.cap);
    const m = { type: "consumato", part: true, qty: finished ? 1 : 0, levelFrom: fromLvl, levelTo: toLvl, mlFrom: Math.round(e.remFrom), mlTo, ml: Math.round(e.remFrom - mlTo), date: e.date || today(), note: e.note || "" };
    if (e.rating) m.rating = Math.min(10, Math.max(1, e.rating));
    it.movements = [...(it.movements || []), m];
    it.fields = Object.assign({}, it.fields || {});
    if (e.capAsk) it.capacityMl = e.cap;
    if (finished) {
      it.qty = it.qty - 1;
      it.fields.livello = "Piena";
      it.remainingMl = null;
      if (it.cond === "Aperta") it.cond = "Sigillata";
      if (it.qty <= 0) { it.qty = 0; it.status = "out"; }
    } else {
      it.fields.livello = toLvl;
      it.remainingMl = mlTo;
      const c = cat(it.catId);
      if (c && c.cond.includes("Aperta")) it.cond = "Aperta";
    }
    try { await saveItem(it); closeModal(); toast(finished ? "Bottiglia finita" : "Restano " + fmtCl(mlTo)); render(); } catch (err) { toast(dbErr(err), 4500); }
    return;
  }
  const qty = Math.min(it.qty, Math.max(1, parseInt(val("x_qty"), 10) || 1));
  const m = { type: e.type, qty, date: val("x_date") || today(), note: val("x_note").trim() };
  if (e.type === "venduto") { m.price = parseNum(val("x_price")); m.fees = parseNum(val("x_fees")); m.channel = val("x_channel"); m.cost = it.buyPrice != null ? it.buyPrice * qty : null; m.costKind = it.buyKind; }
  if (e.type === "consumato") { const r = parseInt(val("x_rating"), 10); if (r) m.rating = Math.min(10, Math.max(1, r)); }

  it.qty = it.qty - qty;
  if (it.qty <= 0) { it.qty = 0; it.status = "out"; }
  try { await saveItem(it); closeModal(); toast("Registrato"); render(); } catch (err) { toast(dbErr(err), 4500); }
}

  if (!its.length) return;

/* ================= Promemoria backup ================= */
function bkInfo() {
  const every = lsGet("col.bkEvery", 30);
  const last = lsGet("col.lastBackup", null);
  let first = lsGet("col.firstUse", null);
  if (!first) { first = nowIso(); lsSet("col.firstUse", first); }
  const since = last || first;
  const days = Math.floor((Date.now() - new Date(since).getTime()) / 864e5);
  const changes = [...S.items.values()].filter(i => (i.updatedAt || "") > since).length;
  const byDays = every > 0 && days >= every;
  const byChanges = every > 0 && lsGet("col.bkChanges", true) && changes >= 50;
  const snooze = lsGet("col.bkSnooze", null);
  const snoozed = snooze && Date.now() < new Date(snooze).getTime();
  return { every, last, days, changes, due: (byDays || byChanges) && S.items.size > 0, show: (byDays || byChanges) && S.items.size > 0 && !snoozed, byDays, byChanges };
}
function bkDone() { lsSet("col.lastBackup", nowIso()); lsSet("col.bkSnooze", null); }

/* ================= Statistiche ================= */
function stYear(d) { return d ? String(d).slice(0, 4) : ""; }
function vStats() {
  const st = S.stats = S.stats || { y: "all" };
  const items = [...S.items.values()].filter(i => !i.deleted && cat(i.catId));
  const buyDateOf = i => i.buyDate || (i.createdAt || "").slice(0, 10);
  const realBuy = i => i.buyPrice != null && i.buyKind !== "stimato";
  // anni presenti
  const years = new Set();
  items.forEach(i => { if (realBuy(i) && buyDateOf(i)) years.add(stYear(buyDateOf(i))); (i.movements || []).forEach(m => { if (m.date) years.add(stYear(m.date)); }); });
  const ylist = [...years].filter(y => /^\d{4}$/.test(y)).sort();
  const inY = d => st.y === "all" || stYear(d) === st.y;
  let spent = 0, cashed = 0, nIn = 0, drunk = 0, sold = 0;
  const perY = {};
  const P = y => (perY[y] = perY[y] || { s: 0, c: 0 });
  items.forEach(i => {
    if (realBuy(i)) {
      const q = (Number(i.qty) || 0) + (i.movements || []).filter(m => !m.part && m.type !== "carico").reduce((a, m) => a + (Number(m.qty) || 0), 0);
      const amount = i.buyPrice * Math.max(1, q);
      const y = stYear(buyDateOf(i));
      if (/^\d{4}$/.test(y)) P(y).s += amount;
      if (inY(buyDateOf(i))) spent += amount;
    }
    if (inY((i.createdAt || "").slice(0, 10)) && i.status !== "wish") nIn += Number(i.qty) || 1;
    (i.movements || []).forEach(m => {
      if (m.type === "venduto") { const v = (Number(m.price) || 0) - (Number(m.fees) || 0); if (/^\d{4}$/.test(stYear(m.date))) P(stYear(m.date)).c += v; if (inY(m.date)) { cashed += v; sold += Number(m.qty) || 1; } }
      if (m.type === "consumato" && inY(m.date)) drunk += m.part ? (m.levelTo === "Finita" ? 1 : 0) : (Number(m.qty) || 1);
    });
  });
  const live = items.filter(i => i.status === "in");
  const value = sumVal(live);
  let h = '<div class="wrap stack"><h1>Statistiche</h1>';
  h += '<div class="chips">' + [["all", "Tutto"], ...ylist.slice().reverse().map(y => [y, y])].map(([k, l]) => '<button type="button" class="chip' + (st.y === k ? " on" : "") + '" data-act="stY" data-v="' + k + '">' + l + '</button>').join("") + '</div>';
  const box = (v, l, cls) => '<div class="card pad" style="padding:12px"><div class="' + (cls || "") + '" style="font-size:20px;font-weight:700">' + v + '</div><div class="small muted">' + l + '</div></div>';
  const gain = value + cashed - spent;
  h += '<div class="grid2" style="gap:8px">' + box(eur(spent), st.y === "all" ? "Speso in totale" : "Speso nel " + st.y) + box(eur(cashed), st.y === "all" ? "Incassato" : "Incassato nel " + st.y, "up") + box(eur(value), "Valore attuale") + (st.y === "all" ? box(signedEur(gain), "Guadagno teorico", gain >= 0 ? "up" : "down") : box(pl(nIn, "pezzo", "pezzi"), "Entrati nel " + st.y)) + '</div>';
  if (st.y === "all") h += '<div class="xs muted" style="margin-top:-4px">Guadagno teorico = valore attuale + incassato − speso. Contano solo i prezzi d\'acquisto reali, non quelli stimati.</div>';
  // barre per anno
  const ys = ylist.slice(-6);
  const mx = Math.max(1, ...ys.map(y => Math.max(P(y).s, P(y).c)));
  if (ys.length) {
    h += '<div class="card pad stack" style="gap:10px"><div class="between"><span class="b small">Speso e incassato per anno</span><span class="row xs muted" style="gap:10px"><span class="row" style="gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:var(--ink)"></span>Speso</span><span class="row" style="gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:#6FA08C"></span>Incassato</span></span></div>';
    ys.forEach(y => { const r = P(y); h += '<div style="display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center"><span class="xs muted">' + y + '</span><div class="stack" style="gap:3px"><div class="row" style="gap:6px"><div style="height:10px;width:' + Math.max(2, Math.round(r.s / mx * 70)) + '%;border-radius:3px;background:var(--ink)"></div><span class="xs">' + eur(r.s) + '</span></div><div class="row" style="gap:6px"><div style="height:10px;width:' + Math.max(2, Math.round(r.c / mx * 70)) + '%;border-radius:3px;background:#6FA08C"></div><span class="xs">' + eur(r.c) + '</span></div></div></div>'; });
    h += '</div>';
  }
  // ripartizione
  const cfg = S.config;
  const parts = [...cfg.groups].map(g => ({ n: g.name, v: sumVal(cfg.cats.filter(c => c.group === g.id).flatMap(c => catItems(c.id))) }))
    .concat(cfg.cats.filter(c => !c.group || !group(c.group)).map(c => ({ n: c.name, v: sumVal(catItems(c.id)) })))
    .filter(p => p.v > 0).sort((a, b) => b.v - a.v);
  if (parts.length) {
    const cols = ["#2F5D50", "#6FA08C", "#A7C4B5", "#C9B27C", "#8A8F98", "#D4DED8", "#4A6FA5", "#B5895A"];
    const tot = parts.reduce((a, p) => a + p.v, 0);
    h += '<div class="card pad stack" style="gap:10px"><span class="b small">Dove sta il valore</span><div class="row" style="height:14px;border-radius:7px;overflow:hidden;gap:2px">' + parts.map((p, i) => '<div style="height:14px;width:' + (p.v / tot * 100).toFixed(2) + '%;background:' + cols[i % cols.length] + '"></div>').join("") + '</div><div>' + parts.map((p, i) => '<div class="between small" style="padding:4px 0"><span class="row" style="gap:8px"><span style="width:10px;height:10px;border-radius:3px;background:' + cols[i % cols.length] + '"></span>' + esc(p.n) + '</span><span>' + eur(p.v) + ' · ' + Math.round(p.v / tot * 100) + '%</span></div>').join("") + '</div></div>';
  }
  // rivalutati
  const rv = live.filter(i => realBuy(i) && i.value != null && i.buyPrice > 0 && (st.y === "all" || stYear(buyDateOf(i)) === st.y)).map(i => ({ i, g: (i.value - i.buyPrice) * (Number(i.qty) || 1), p: (i.value - i.buyPrice) / i.buyPrice * 100 })).filter(x => x.g > 0).sort((a, b) => b.g - a.g).slice(0, 5);
  if (rv.length) h += '<div class="sect">Rivalutati di più</div><div class="card list">' + rv.map(x => '<button type="button" class="li" data-act="openItem" data-id="' + esc(x.i.id) + '"><span class="grow"><span class="b" style="display:block;font-size:14px">' + esc(x.i.name || "Senza nome") + '</span><span class="small muted">' + esc(cat(x.i.catId).name) + '</span></span><span style="text-align:right"><span class="b up" style="display:block">' + signedEur(x.g) + '</span><span class="xs muted">+' + Math.round(x.p).toLocaleString("it-IT") + '%</span></span></button>').join("") + '</div>';
  else h += '<div class="small muted">Per vedere i pezzi che si sono rivalutati servono prezzi d\'acquisto reali e quotazioni.</div>';
  // numeri
  const top = live.slice().sort((a, b) => (Number(b.value) || 0) - (Number(a.value) || 0))[0];
  const yl = st.y === "all" ? "in totale" : "nel " + st.y;
  h += '<div class="sect">In numeri</div><div class="card list" style="padding:0 16px">' +
    '<div class="kv"><span>Pezzi entrati ' + yl + '</span><span>' + nIn + '</span></div>' +
    '<div class="kv"><span>Bottiglie finite ' + yl + '</span><span>' + drunk + '</span></div>' +
    '<div class="kv"><span>Pezzi venduti ' + yl + '</span><span>' + sold + '</span></div>' +
    (top && top.value ? '<div class="kv"><span>Pezzo più prezioso</span><span>' + esc(top.name || "Senza nome") + ' · ' + eur(top.value) + '</span></div>' : "") + '</div>';
  return h + '</div>';
}

/* ================= Valore del metallo ================= */
const METALS = { Oro: "au", Argento: "ag" };
function metalOf(it, c) {
  if (!c || !c.fields.some(f => f.k === "metallo")) return null;
  const m = METALS[String(fv(it, "metallo") || "")];
  return m || null;
}
function metalBox(it, c) {
  const m = metalOf(it, c); if (!m) return "";
  const name = m === "au" ? "Oro" : "Argento";
  const peso = numF(it, "peso"); let tit = numF(it, "titolo");
  const mp = (S.config && S.config.metals) || {};
  const price = mp[m];
  let h = '<div class="card pad stack" style="gap:6px"><div class="between"><span class="b" style="font-size:16px">Valore del metallo</span><span class="badge grey">' + name + '</span></div>';
  if (peso == null || tit == null) {
    h += '<div class="small muted">Per calcolarlo servono <b>peso</b> e <b>titolo</b> (per esempio 900 ‰ per gli scudi d\'argento, 900 ‰ per i marenghi d\'oro). Aggiungili da Modifica.</div>';
    return h + '<button type="button" class="btn sm" data-act="editItem" data-id="' + esc(it.id) + '">' + ic("edit", 16) + 'Aggiungi peso e titolo</button></div>';
  }
  const purity = tit > 1 ? tit / 1000 : tit;
  const pure = peso * purity;
  const kv = (k, v, b) => '<div class="kv"><span>' + k + '</span><span' + (b ? ' class="b"' : "") + '>' + v + '</span></div>';
  const g = n => n.toLocaleString("it-IT", { maximumFractionDigits: 2, minimumFractionDigits: 2 });
  h += kv("Peso", g(peso) + " g") + kv("Titolo", (tit > 1 ? tit : Math.round(tit * 1000)) + " ‰") + kv(name + " puro", g(pure) + " g");
  if (price) {

async function ixGo(btn) {
  const ix = S.ix; const c = ixTpl(); const b = ix.built;
  const msg = $("ixMsg"); if (btn) btn.disabled = true;
  const created = [], prev = [], toSave = [];
  b.items.forEach(d => {
    const ex = d._match && ix.mode !== "new" ? S.items.get(d._match) : null;
    delete d._match;
    if (ex) {
      if (ix.mode === "skip") return;
      prev.push(JSON.parse(JSON.stringify(ex)));
      const n = Object.assign({}, ex, { fields: Object.assign({}, ex.fields || {}) });
      n.qty = (Number(ex.qty) || 0) + (Number(d.qty) || 0);
      Object.entries(d.fields).forEach(([k, v]) => { if (n.fields[k] === undefined || n.fields[k] === null || n.fields[k] === "") n.fields[k] = v; });
      ["cond", "location", "buyFrom", "buyDate", "barcode", "tags"].forEach(k => { if (!n[k] && d[k]) n[k] = d[k]; });
      if (n.buyPrice == null && d.buyPrice != null) { n.buyPrice = d.buyPrice; n.buyKind = "reale"; }
      if (d.notes) n.notes = [n.notes, d.notes].filter(Boolean).join("\n");
      toSave.push(n);
    } else {
      if (ix.buyAsValue && d.value == null && d.buyPrice != null) { d.value = d.buyPrice; d.valueDate = today(); d.valueSource = "Prezzo d'acquisto"; d.valueConf = "bassa"; }

      d.createdAt = nowIso();
      created.push({ id: d.id, catId: d.catId });

    }
  });
  try {
    for (let i = 0; i < toSave.length; i += 150) { if (msg) msg.textContent = "Salvo " + Math.min(i + 150, toSave.length) + " di " + toSave.length + "…"; await saveItems(toSave.slice(i, i + 150)); }

    lsSet("col.lastImport", { at: nowIso(), n: toSave.length, cat: c.name });
    ix.result = { created: created.length, updated: prev.length, cat: c.name };
    if (ix.catId === IX_AUTO) { const cnt = {}; toSave.forEach(d => { cnt[d.catId] = (cnt[d.catId] || 0) + 1; }); ix.result.openId = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || ""; ix.result.split = ixAutoCats().map(x => x.name + " " + (cnt[x.id] || 0)).join(", "); }
    ix.step = 4; render(); window.scrollTo(0, 0);
  } catch (e) { toast(dbErr(e), 5000); if (btn) btn.disabled = false; }

async function ixUndo() {
  if (!(await confirmBox("Annullare l'ultima importazione?", "I pezzi nuovi verranno tolti e quelli aggiornati tornano com'erano.", "Annulla importazione", true))) return;
  try {
    const snap = await S.db.doc("imports/last").get();
    const d = snap && snap.exists ? snap.data() : null;
    if (!d) { toast("Non trovo l'ultima importazione."); return; }
    const del = (d.created || []).map(x => S.items.get(x.id)).filter(Boolean).map(i => Object.assign({}, i, { deleted: true }));
    const list = [...del, ...(d.prev || [])];
    for (let i = 0; i < list.length; i += 150) await saveItems(list.slice(i, i + 150));
    await S.db.doc("imports/last").set({ at: nowIso(), created: [], prev: [], undone: true });
    lsSet("col.lastImport", null);
    S.ix = null; toast("Importazione annullata"); tab("tools");
  } catch (e) { toast(dbErr(e), 5000); }
}

function analyzeImport(text, name) {

/* ================= Revisione dati ================= */
const REV_SEV = { err: { label: "Errore", cls: "warn", sect: "Errori" }, warn: { label: "Controlla", cls: "amber", sect: "Da controllare" }, tip: { label: "Suggerimento", cls: "", sect: "Suggerimenti" } };
const REV_ORDER = { err: 0, warn: 1, tip: 2 };
const RAI_MAX = 60;
function pl(n, one, many) { return n + " " + (n === 1 ? one : many); }

function fv(it, k) { return it.fields ? it.fields[k] : undefined; }
function numF(it, k) { const v = fv(it, k); if (v === "" || v == null) return null; const n = typeof v === "number" ? v : parseNum(String(v)); return n == null || isNaN(n) ? null : n; }

/* --- livello 1: coerenza, senza rete --- */
function reviewLocal() {
  const out = [];

  const add = (it, key, sev, text, extra) => {
    if (revIgnored(it, key)) return;
    out.push(Object.assign({ key, sev, text, itemId: it.id, catId: it.catId, uid: it.id + "|" + key }, extra || {}));
  };
  const items = [...S.items.values()].filter(i => !i.deleted && cat(i.catId));
  for (const it of items) {
    const c = cat(it.catId);
    const live = it.status !== "out";
    if (!String(it.name || "").trim()) add(it, "noname", "err", "Manca il nome.");
    c.fields.forEach(f => {
      if (f.type === "number" && /^(anno|annata)$/.test(f.k)) {
        const y = numF(it, f.k);
        if (y != null && y > Y) add(it, "future:" + f.k, "err", f.label + " " + y + ": è nel futuro.", { fix: null });
        else if (y != null && y < 1000 && it.catId !== "monete-antiche") add(it, "short:" + f.k, "warn", f.label + " " + y + ": sembra mancare una cifra.");
      }
      if (f.type === "select" && f.options.length) {
        const v = fv(it, f.k);
        if (v != null && v !== "" && !f.options.includes(String(v))) add(it, "opt:" + f.k, "tip", f.label + ": \"" + v + "\" non è tra le voci previste.");
      }
    });
    if (it.cond && c.cond.length && !c.cond.includes(it.cond)) add(it, "cond", "tip", "Stato \"" + it.cond + "\" non è tra quelli previsti per " + c.name + ".");
    const anno = numF(it, "anno");
    if (it.catId === "francobolli-antichi" && anno != null && anno > 1862) add(it, "rule:antichi", "err", "Anno " + anno + " per un francobollo degli Antichi Stati (fino al 1861).");
    if (it.catId === "francobolli" && anno != null) {
      const p = String(fv(it, "periodo") || "");
      if (/^Regno/.test(p) && anno > 1946) add(it, "rule:regno", "err", "Anno " + anno + " ma periodo Regno d'Italia (fino al 1946).");
      if (/^Repubblica/.test(p) && anno < 1946) add(it, "rule:rep", "err", "Anno " + anno + " ma periodo Repubblica (dal 1946).");
      if (/^RSI/.test(p) && (anno < 1943 || anno > 1946)) add(it, "rule:rsi", "warn", "Anno " + anno + " fuori dal periodo RSI / Luogotenenza (1943–1946).");
    }
    if (it.catId === "monete-storiche" && anno != null && anno > 1960) add(it, "rule:storica", "warn", "Anno " + anno + ": sembra una moneta moderna, non storica.");
    if (it.catId === "monete" && anno != null && anno < 1900) add(it, "rule:moderna", "warn", "Anno " + anno + ": sembra una moneta storica, non moderna.");
    if (it.catId === "vini") {
      const an = numF(it, "annata"), da = numF(it, "bere_da"), en = numF(it, "bere_entro");
      if (da != null && en != null && en < da) add(it, "rule:bere", "err", "Da bere entro il " + en + ", prima di \"da bere dal\" " + da + ".");
      if (an != null && da != null && da < an) add(it, "rule:bereann", "err", "Da bere dal " + da + ", prima dell'annata " + an + ".");
      if (live && en != null && en < Y) add(it, "rule:scaduto", "tip", "Da bere entro il " + en + ": la finestra è già passata.");
    }
    if (live && Number(it.qty) <= 0) add(it, "qty0", "err", "Quantità 0 ma risulta in collezione.");
    if (it.remainingMl != null && it.capacityMl != null && it.remainingMl > it.capacityMl) add(it, "ml", "err", "Restano " + fmtCl(it.remainingMl) + " su una bottiglia da " + fmtCl(it.capacityMl) + ".");
    if (c.consumable && it.cond === "Sigillata" && fv(it, "livello") && fv(it, "livello") !== "Piena") add(it, "sealed", "warn", "Bottiglia sigillata ma livello \"" + fv(it, "livello") + "\".");
    (it.movements || []).forEach((m, j) => { if (m.type === "venduto" && m.price == null) add(it, "soldnoprice:" + j, "warn", "Venduto il " + fmtDate(m.date) + " senza prezzo di vendita."); });
    if (live && it.buyPrice > 0 && it.value > 0 && it.buyKind !== "stimato") {
      const r = it.buyPrice / it.value;
      const cmp = [["Prezzo d'acquisto", eur(it.buyPrice) + " (reale)", ""], ["Quotazione", eur(it.value) + (it.valueDate ? " · " + fmtDate(it.valueDate) : ""), ""]];
      if (r > 2.5) add(it, "buyhigh", "warn", "Pagato " + eur(it.buyPrice) + ", quotazione " + eur(it.value) + ": oltre il doppio.", { info: cmp, note: "Può essere giusto (edizione particolare, acquisto in negozio) oppure un errore di battitura." });
      else if (r < 0.25) add(it, "buylow", "warn", "Pagato " + eur(it.buyPrice) + ", quotazione " + eur(it.value) + ": molto meno della quotazione.", { info: cmp, note: "Controlla prezzo e quotazione: uno dei due potrebbe essere sbagliato." });
    }
  }
  // doppioni
  const byKey = {};
  items.filter(i => i.status !== "out").forEach(i => {
    const f = i.fields || {};
    const k = [i.catId, normTxt(i.name), i.cond || "", i.status, JSON.stringify(Object.keys(f).sort().map(x => [x, f[x]]))].join("|");
    (byKey[k] = byKey[k] || []).push(i);
  });
  Object.values(byKey).forEach(g => {
    if (g.length < 2) return;
    const first = g[0];
    if (g.some(x => revIgnored(x, "dup"))) return;
    const q = g.reduce((a, x) => a + (Number(x.qty) || 0), 0);
    add(first, "dup", "warn", "Possibile doppione: " + g.length + " schede uguali.", { fix: { type: "merge", ids: g.map(x => x.id), label: "Unisci (qtà " + q + ")" }, ignoreLabel: "Sono diverse", dupIds: g.map(x => x.id) });
  });
  return out;
}

/* --- livello 2: cataloghi online (solo app) --- */
async function reviewCatalog() {
  const R = S.review;
  if (S.env !== "pwa") return;
  if (!navigator.onLine) { toast("Serve la connessione per confrontare con i cataloghi."); return; }
  R.catBusy = true; R.catMsg = "Avvio…"; render();
  const out = []; let nCards = 0, nBooks = 0;
  const add = (it, key, sev, text, extra) => { if (!revIgnored(it, key)) out.push(Object.assign({ key, sev, text, itemId: it.id, catId: it.catId, uid: it.id + "|" + key, src: "cat" }, extra || {})); };
  const say = t => { R.catMsg = t; const el = $("revCatMsg"); if (el) el.textContent = t; };
  try {
    for (const c of catalogCats()) {
      const src = catalogOf(c.id);
      const list = catItems(c.id).filter(i => i.ref && i.ref.card);
      if (!list.length) continue;
      nCards += list.length;
      let prices = {};
      try { prices = await fetchPrices(src, list.map(i => i.ref), (i, n) => say(c.name + ": " + i + " di " + n)); } catch (e) { }
      const sets = {};
      for (const it of list) {
        const r = it.ref, f = it.fields || {};
        const srcName = src === "tcgdex" ? "TCGdex" : "Scryfall";
        if (f.numero && r.num && normNum(f.numero) !== normNum(r.num)) add(it, "cat:num", "err", "Il numero nella scheda (" + f.numero + ") non corrisponde alla carta collegata (" + r.num + ").", { cmp: [["Numero", f.numero, r.num]], fix: { type: "fields", set: { numero: String(r.num) }, label: "Applica \"" + r.num + "\"" }, srcName });
        const p = prices[r.card];
        const lab = p && rarityLabel(src, p.rarity);
        if (lab && f.rarita && lab !== f.rarita) add(it, "cat:rar", src === "scryfall" ? "err" : "warn", "Nel catalogo la rarità è \"" + lab + "\", nella scheda c'è \"" + f.rarita + "\".", { cmp: [["Rarità", f.rarita, lab]], fix: { type: "fields", set: { rarita: lab }, label: "Applica \"" + lab + "\"" }, srcName });
        if (!/ital/i.test(String(f.lingua || ""))) {
          if (!(r.set in sets)) { try { sets[r.set] = await loadSetCards(src, r.set, "en"); } catch (e) { sets[r.set] = null; } }
          const card = sets[r.set] && sets[r.set].cards.find(x => x.id === r.card);
          const cn = card && (card.nameEn || card.name);
          const nm = normTxt(it.name);
          if (cn && nm && normTxt(cn) !== nm && !nm.includes(normTxt(cn)) && !normTxt(cn).includes(nm)) add(it, "cat:name", "warn", "Nel catalogo questa carta si chiama \"" + cn + "\".", { cmp: [["Nome", it.name, cn], ["Set", f.set || "—", sets[r.set].name], ["Numero", f.numero || "—", r.num]], fix: { type: "name", v: cn, label: "Usa \"" + cn + "\"" }, srcName });
        }
      }
    }
    const books = [...S.items.values()].filter(i => !i.deleted && i.fields && i.fields.isbn);
    nBooks = books.length;
    let done = 0;
    await pool(books.slice(0, 200), 4, async it => {
      const code = cleanCode(it.fields.isbn);
      say("Libri: " + (++done) + " di " + Math.min(200, books.length));
      if (!isIsbn(code)) { add(it, "isbn:bad", "warn", "ISBN \"" + it.fields.isbn + "\" non valido (lunghezza o cifre)."); return; }
      let b = cacheGet("isbn." + code, 30 * 864e5);
      if (!b) { b = await lookupBook(code); if (b) cacheSet("isbn." + code, b); }
      if (!b) { add(it, "isbn:none", "tip", "ISBN non trovato in Google Books né in Open Library."); return; }
      const t1 = normTxt(it.name), t2 = normTxt(b.title);
      const cmp = [["Titolo", it.name, b.title], ["Autore", it.fields.autore || "—", b.authors || "—"], ["Anno", it.fields.anno || "—", b.year || "—"]];
      if (t1 && t2 && !t1.includes(t2.split(" ").slice(0, 2).join(" ")) && !t2.includes(t1.split(" ").slice(0, 2).join(" "))) add(it, "isbn:title", "warn", "L'ISBN corrisponde a \"" + b.title + "\".", { cmp, fix: { type: "name", v: b.title, label: "Usa il titolo del catalogo" }, srcName: "Google Books" });
      else if (it.fields.autore && b.authors) {
        const a1 = normTxt(it.fields.autore).split(" "), a2 = normTxt(b.authors).split(" ");
        if (!a1.some(w => w.length > 2 && a2.includes(w))) add(it, "isbn:author", "warn", "Per questo ISBN l'autore risulta " + b.authors + ".", { cmp, fix: { type: "fields", set: { autore: b.authors }, label: "Applica l'autore" }, srcName: "Google Books" });
      }
    });
    R.cat = { at: nowIso(), issues: out, nCards, nBooks };
    lsSet("col.revCat", { at: R.cat.at, nCards, nBooks });
    toast(out.length ? out.length + " segnalazioni dai cataloghi" : "Nessuna differenza con i cataloghi", 4000);
  } catch (e) { toast("Confronto interrotto: " + (e.message || "errore di rete"), 5000); }
  R.catBusy = false; R.catMsg = "";
  reviewPrepPack();
  render();
}

/* --- correzioni --- */
async function reviewApply(uid) {
  const x = reviewAll().find(y => y.uid === uid);
  if (!x || !x.fix) return;
  try {
    if (x.fix.type === "merge") {
      const list = x.fix.ids.map(id => S.items.get(id)).filter(Boolean);
      const keep = Object.assign({}, list[0]);
      keep.qty = list.reduce((a, i) => a + (Number(i.qty) || 0), 0);
      keep.photos = [...new Set(list.flatMap(i => i.photos || []))];
      keep.movements = list.flatMap(i => i.movements || []);
      const notes = list.map(i => i.notes).filter(Boolean); if (notes.length) keep.notes = [...new Set(notes)].join("\n");
      const rest = list.slice(1).map(i => Object.assign({}, i, { deleted: true }));
      await saveItems([keep, ...rest]);
      toast("Schede unite");
    } else {
      const it = Object.assign({}, S.items.get(x.itemId));
      if (x.fix.type === "name") it.name = x.fix.v;
      else it.fields = Object.assign({}, it.fields || {}, x.fix.set);
      await saveItem(it);
      toast("Corretto");
    }
    reviewDropCat(uid);
    reviewRefresh(); reviewAfterAct(uid);
  } catch (e) { toast(dbErr(e), 4500); }
}
async function reviewIgnore(uid) {
  const x = reviewAll().find(y => y.uid === uid);
  if (!x || x.agg) return;
  try {
    const ids = x.dupIds || [x.itemId];
    const list = ids.map(id => { const it = Object.assign({}, S.items.get(id)); it.reviewIgnore = [...new Set([...(it.reviewIgnore || []), x.key])]; return it; });
    await saveItems(list);
    reviewDropCat(uid);
    reviewRefresh(); reviewAfterAct(uid);
  } catch (e) { toast(dbErr(e), 4500); }
}
function reviewDropCat(uid) { const R = S.review; if (R.cat) R.cat.issues = R.cat.issues.filter(y => y.uid !== uid); }
function reviewAfterAct(uid) {
  if (S.view.name === "reviewItem") {
    const list = S.view.list || [];
    const i = list.indexOf(uid);
    const live = new Set(reviewAll().map(y => y.uid));
    const next = list.slice(i + 1).find(u => live.has(u)) || list.slice(0, i).reverse().find(u => live.has(u));
    if (next) { S.view.uid = next; render(); window.scrollTo(0, 0); } else back();
    return;
  }
  render();
}

    'Rispondi solo con un array JSON, un oggetto per pezzo con lo stesso id: [{"id":"...","esito":"ok|controlla|non_verificabile","nota":"spiegazione breve, max 30 parole, in italiano","correzioni":{"chiave_campo":"valore corretto"}}]. In correzioni metti solo valori di cui sei sicuro, con le chiavi dei campi indicate (usa "nome" per il nome); per i campi a scelta usa uno dei valori ammessi. Se è tutto plausibile, esito ok e correzioni vuote.';

async function raiRun() {
  const r = S.rai;
  const list = raiCandidates().slice(0, RAI_MAX);
  if (!list.length) return;
  let lim = null;
  try { lim = await S.sample.limits(); } catch (e) { }
  const maxImg = lim && lim.images ? Math.max(1, lim.images.maxCount || 1) : 0;
  r.step = "run"; r.pct = 5; r.msg = "Preparo i pezzi"; r.status = ""; r.results = []; r.showOk = false; render();
  r.ctl = new AbortController();
  let tools = null;
  if (r.web) { const st = await getSearchTools(t => { r.status = t; const el = $("raiStatus"); if (el) el.textContent = t; }); if (st.status === "ok") tools = st.tools; else toast(webStatusMsg(st.status) || "Ricerca web non disponibile: verifico senza.", 5000); }
  const size = raiLotSize();
  const lots = [];
  for (let i = 0; i < list.length; i += size) lots.push(list.slice(i, i + size));
  try {
    for (let b = 0; b < lots.length; b++) {
      if (r.ctl.signal.aborted) break;
      const lot = lots[b];
      r.msg = lots.length > 1 ? "Lotto " + (b + 1) + " di " + lots.length : "Verifica in corso"; r.pct = 10 + Math.round(b / lots.length * 85); render();
      const images = []; const photoOf = {};
      for (const it of lot) {
        if (images.length >= maxImg) break;
        const pid = (it.photos || [])[0];
        if (!pid) continue;
        try { const bl = await getPhotoBlob(pid); if (bl) { images.push(await compressImage(bl, 900, 0.8)); photoOf[it.id] = images.length; } } catch (e) { }
      }
      const so = { signal: r.ctl.signal, cache: false };
      if (images.length) so.images = images;
      if (tools) so.tools = tools;
      let arr = [];
      try { const out = await S.sample.json(raiPrompt(lot, !!tools, photoOf), so); arr = Array.isArray(out) ? out : []; }
      catch (e) { if (e && e.code === "cancelled") break; toast(sampleErr(e), 5000); if (e && ["not_granted", "sampling_disabled", "rate_limited", "session_expired"].includes(e.code)) break; continue; }
      const upd = [];
      arr.forEach(o => {
        const it = o && lot.find(x => x.id === o.id); if (!it) return;
        const esito = ["ok", "controlla", "non_verificabile"].includes(o.esito) ? o.esito : "non_verificabile";
        const c = cat(it.catId);
        const corr = {};
        Object.entries(o.correzioni || {}).forEach(([k, v]) => {
          if (v == null || v === "") return;
          if (k === "nome") { corr.nome = String(v).slice(0, 160); return; }
          const f = c.fields.find(y => y.k === k); if (!f) return;
          if (f.type === "select" && f.options.length && !f.options.includes(String(v))) return;
          corr[k] = f.type === "number" ? (parseNum(String(v)) ?? null) : f.type === "bool" ? !!v : String(v).slice(0, 200);
          if (corr[k] == null) delete corr[k];
        });
        const res = { id: it.id, esito, nota: String(o.nota || "").slice(0, 300), corr };
        r.results.push(res);
        const n = Object.assign({}, it, { reviewedAt: today(), reviewRes: esito, reviewNote: res.nota });
        upd.push(n);
      });
      if (upd.length) { try { await saveItems(upd); } catch (e) { } }
    }
  } finally {
    r.step = r.results.length ? "done" : "pick";
    if (!r.results.length) toast("Nessun risultato dalla verifica.", 4000);
    reviewRefresh(true);
    render(); window.scrollTo(0, 0);
  }
}
async function raiFix(id, k) {
  const x = S.rai.results.find(y => y.id === id); if (!x) return;
  const it = Object.assign({}, S.items.get(id));

  if (k === "nome") it.name = v; else it.fields = Object.assign({}, it.fields || {}, { [k]: v });

}

function reviewPackIds() {

  const never = [...S.items.values()].filter(i => !i.deleted && !i.reviewedAt && !flagged.has(i.id) && (i.photos || []).length).map(i => i.id);

function reviewPrepPack() {
  if (S.env !== "pwa") return;
  const R = S.review || (S.review = {});
  const ids = reviewPackIds();
  const key = ids.join(",");
  if (R.pack && R.pack.key === key) return R.pack.promise;
  const pack = { key, text: null, n: ids.length };
  pack.promise = (async () => {
    const items = ids.map(id => { const i = S.items.get(id); const o = cleanItem(i); o.id = i.id; o.catId = i.catId; return o; });
    const photos = {}; let size = 0;
    for (const it of items) { const p = (it.photos || [])[0]; if (!p || photos[p] || size > 450000) continue; const d = await smallPhoto(p); if (d) { photos[p] = d; size += d.length; } }
    items.forEach(it => { it.photos = (it.photos || []).filter(p => photos[p]); });
    pack.text = JSON.stringify({ app: "collezioni", schema: 1, source: "pwa", kind: "delta", review: true, ids, exportedAt: nowIso(), config: S.config, items, photos });
    return pack;
  })();
  R.pack = pack;
  return pack.promise;
}

async function saveCat() {
  readCatForm();

  if (!d.name) { toast("Dai un nome alla categoria."); return; }
  const fields = [];
  const keys = [];
  for (const f of d.fields) {
    if (!String(f.label || "").trim()) continue;
    const k = f.k || fieldKey(f.label, keys);
    keys.push(k);
    fields.push({ k, label: f.label.trim(), type: f.type || "text", options: f.type === "select" ? (f.options || []) : [] });
  }
  const cfg = JSON.parse(JSON.stringify(S.config || { groups: [], cats: [] }));

  const ix = cfg.cats.findIndex(c => c.id === body.id);

async function delCat() {

}
async function moveCat(id, dir) {
  const cfg = JSON.parse(JSON.stringify(S.config));
  const c = cfg.cats.find(x => x.id === id);
  const sibs = cfg.cats.filter(x => (x.group || null) === (c.group || null)).sort((a, b) => (a.order || 0) - (b.order || 0));
  const ix = sibs.indexOf(c), j = ix + dir;
  if (j < 0 || j >= sibs.length) return;
  [sibs[ix], sibs[j]] = [sibs[j], sibs[ix]];
  sibs.forEach((s, k) => { s.order = (k + 1) * 10 + (c.group ? 0 : 1000); });
  try { await saveConfig(cfg); S.config = normConfig(cfg); render(); } catch (e) { toast(dbErr(e)); }
}

async function getJson(url, opts) {

/* --- elenco set --- */
async function loadSets(src, lang) {
  const key = src + ":" + lang;
  if (CAT_CACHE.sets[key]) return CAT_CACHE.sets[key];
  let sets = cacheGet("sets2." + key, 3 * 864e5);
  if (!sets) {
    if (src === "tcgdex") {
      const d = await getJson("https://api.tcgdex.net/v2/" + lang + "/sets") || [];
      sets = d.map(x => ({ id: x.id, name: x.name, total: (x.cardCount && (x.cardCount.official || x.cardCount.total)) || null, logo: x.logo ? x.logo + ".png" : (x.symbol ? x.symbol + ".png" : null) })).reverse();
    } else {
      const d = await getJson("https://api.scryfall.com/sets");
      const skip = new Set(["token", "memorabilia", "alchemy", "minigame", "vanguard", "treasure_chest"]);
      /* le Art Series su Scryfall sono "memorabilia": le tengo, scarto il resto di quella categoria */
      const isArt = x => x.set_type === "memorabilia" && /art series/i.test(x.name || "");
      sets = ((d && d.data) || []).filter(x => !x.digital && (isArt(x) || !skip.has(x.set_type)) && x.card_count > 0)
        .sort((a, b) => (b.released_at || "").localeCompare(a.released_at || ""))
        .map(x => ({ id: x.code, name: x.name, total: x.card_count, logo: x.icon_svg_uri || null, date: x.released_at || "" }));
    }
    cacheSet("sets2." + key, sets);
  }
  CAT_CACHE.sets[key] = sets;
  return sets;
}
/* --- carte di un set --- */
async function loadSetCards(src, setId, lang) {
  const key = src + ":" + setId + ":" + lang;
  if (CAT_CACHE.setCards[key]) return CAT_CACHE.setCards[key];
  let out = null;
  if (src === "tcgdex") {
    let d = null;
    try { d = await getJson("https://api.tcgdex.net/v2/" + lang + "/sets/" + encodeURIComponent(setId)); } catch (e) { if (lang === "en") throw e; }
    let usedLang = lang;
    if (!d && lang !== "en" && lang !== "ja") { d = await getJson("https://api.tcgdex.net/v2/en/sets/" + encodeURIComponent(setId)); usedLang = "en"; }
    if (!d) throw new Error("Set non trovato");
    const official = d.cardCount && (d.cardCount.official || d.cardCount.total);
    out = { name: d.name, usedLang, total: official || (d.cards || []).length, cards: (d.cards || []).map(c => ({ id: c.id, num: String(c.localId), numFull: official ? c.localId + "/" + official : String(c.localId), name: c.name, img: c.image ? c.image + "/low.webp" : null, imgBig: c.image ? c.image + "/high.webp" : null })) };
    /* nelle edizioni non inglesi dei set vecchi TCGdex spesso non ha le immagini: uso quelle inglesi della stessa carta */
    if (usedLang !== "en" && usedLang !== "ja" && out.cards.some(c => !c.img)) {
      try {
        const en = await getJson("https://api.tcgdex.net/v2/en/sets/" + encodeURIComponent(setId));
        const byId = {}, byNum = {};
        ((en && en.cards) || []).forEach(c => { byId[c.id] = c; byNum[String(c.localId)] = c; });
        out.cards.forEach(c => {
          const e = byId[c.id] || byNum[c.num];
          if (!e) return;
          if (!c.nameEn) c.nameEn = e.name;
          if (!c.img && e.image) { c.img = e.image + "/low.webp"; c.imgBig = e.image + "/high.webp"; }
        });
      } catch (e) { }
    }
  } else {
    const fetchAll = async (q) => {
      let url = "https://api.scryfall.com/cards/search?unique=prints&order=set&include_extras=true&q=" + encodeURIComponent(q);
      const all = [];
      while (url) {
        const d = await getJson(url);
        if (!d) break;
        all.push(...(d.data || []));
        url = d.has_more ? d.next_page : null;
        if (url) await sleep(110);
      }
      return all;
    };
    let usedLang = lang;
    let cards = await fetchAll("e:" + setId + " lang:" + (lang === "it" ? "it" : "en"));
    if (!cards.length && lang !== "en") { cards = await fetchAll("e:" + setId + " lang:en"); usedLang = "en"; }
    if (!cards.length) throw new Error("Set non trovato");
    const img = c => (c.image_uris || (c.card_faces && c.card_faces[0] && c.card_faces[0].image_uris) || {});
    out = { name: cards[0].set_name, usedLang, total: cards.length, cards: cards.map(c => ({ id: c.id, num: c.collector_number, numFull: c.collector_number, name: c.printed_name || c.name, nameEn: c.name, rarity: c.rarity, img: img(c).small || null, imgBig: img(c).normal || null, eur: numOrNull(c.prices && c.prices.eur), eurFoil: numOrNull(c.prices && c.prices.eur_foil), set: c.set })) };
  }
  out.cards.sort((a, b) => { const na = parseInt(a.num, 10), nb = parseInt(b.num, 10); return (isNaN(na) || isNaN(nb) || na === nb) ? String(a.num).localeCompare(String(b.num), "it", { numeric: true }) : na - nb; });
  CAT_CACHE.setCards[key] = out;
  return out;
}
/* --- prezzi --- */
function rarityLabel(src, r) {
  const v = String(r || "").toLowerCase();
  if (src === "scryfall") return { common: "Comune", uncommon: "Non comune", rare: "Rara", mythic: "Mitica", special: "Speciale", bonus: "Speciale" }[v] || "";
  if (!v) return "";
  if (v.includes("secret") || v.includes("segret")) return "Segreta";
  if (v.includes("ultra") || v.includes("illustration") || v.includes("hyper")) return "Ultra rara";
  if (v.includes("holo")) return "Rara holo";
  if (v.includes("promo")) return "Promo";
  if (v.includes("uncommon") || v.includes("non comune")) return "Non comune";
  if (v.includes("common") || v.includes("comune")) return "Comune";
  if (v.includes("rare") || v.includes("rara")) return "Rara";
  return "";
}
async function pool(list, n, fn, onProg) {
  let i = 0, done = 0;
  const workers = Array.from({ length: Math.min(n, list.length) }, async () => {
    while (i < list.length) { const k = i++; try { await fn(list[k], k); } catch (e) { } done++; if (onProg) onProg(done, list.length); }
  });
  await Promise.all(workers);
}
/* restituisce {cardId: {eur, eurFoil, rarity}} */
async function fetchPrices(src, refs, onProg) {
  const out = {};
  if (src === "tcgdex") {
    await pool(refs, 6, async r => {
      const d = await getJson("https://api.tcgdex.net/v2/" + (r.lang === "ja" ? "ja" : "en") + "/cards/" + encodeURIComponent(r.card));
      if (!d) return;
      const cm = d.pricing && d.pricing.cardmarket;
      out[r.card] = { eur: cm ? numOrNull(cm.trend != null ? cm.trend : cm.avg30) : null, eurFoil: cm ? numOrNull(cm["trend-holo"] != null ? cm["trend-holo"] : cm["avg30-holo"]) : null, rarity: d.rarity || "" };
    }, onProg);
  } else {
    const ids = refs.map(r => r.set && r.num ? { set: r.set, collector_number: String(r.num) } : { id: r.card });

async function setAddGo(btn) {
  const v = S.view; const c = cat(v.catId); const src = catalogOf(v.catId); const st = S.setState; const a = S.setAdd;
  a.cond = $("sa_cond") ? val("sa_cond") : ""; a.edizione = $("sa_ed") ? val("sa_ed") : ""; a.foil = $("sa_foil") ? $("sa_foil").checked : false;
  btn.disabled = true;
  const cards = st.data.cards.filter(x => st.sel.has(x.id));
  const msg = $("sa_msg");
  const lang = st.lang;
  const refs = cards.map(x => ({ src, set: src === "scryfall" ? (x.set || v.setId) : v.setId, card: x.id, num: x.num, lang }));
  let prices = {};
  try { prices = await fetchPrices(src, refs, (d, n) => { if (msg) msg.textContent = "Recupero i prezzi: " + d + " di " + n; }); } catch (e) { if (msg) msg.textContent = "Prezzi non disponibili ora: le carte vengono aggiunte senza quotazione."; }
  const items = cards.map((x, k) => {
    const it = newDraft(v.catId, a.status);
    const p = prices[x.id] || (x.eur != null || x.eurFoil != null ? { eur: x.eur, eurFoil: x.eurFoil, rarity: x.rarity } : null);
    it.name = x.name; it.qty = 1; it.cond = a.cond;
    it.fields = { set: st.data.name, numero: x.numFull, lingua: LANG_NAME[lang] || "Inglese" };
    const rar = rarityLabel(src, (p && p.rarity) || x.rarity); if (rar) it.fields.rarita = rar;
    if (a.edizione) it.fields.edizione = a.edizione;
    if (a.foil) it.fields.foil = true;
    it.ref = refs[k]; it.imageUrl = x.img; it.imageUrlBig = x.imgBig;
    const val = priceFor(it, p);
    if (val != null) { it.value = val; it.valueDate = today(); it.valueConf = "alta"; it.valueSource = src === "tcgdex" ? "Cardmarket, prezzo di tendenza (via TCGdex)" : "Cardmarket, prezzo medio (via Scryfall)"; it.valueHistory = [{ d: today(), v: val }]; if (a.status !== "wish") { it.buyPrice = val; it.buyKind = "stimato"; } }
    it.createdAt = nowIso();
    if (a.status === "in") it.movements = [{ type: "carico", qty: 1, date: today(), price: it.buyPrice }];
    ["_new", "_origBuy", "_cats"].forEach(k2 => delete it[k2]);
    return it;
  });

  catch (e) { btn.disabled = false; toast(dbErr(e), 5000); }
}
async function cardPriceOne(id) {

  const src = catalogOf(it.catId);
  toast("Cerco il prezzo…");

    const v = priceFor(it, p[it.ref.card]);

}

function cxNomKey(x) { return eur2Norm(x.t).split(" ").slice(0, 2).join(" "); }
function cxLinkable(def) {
  const D = CX[def]; if (def !== "lire" && def !== "regno") return [];
  const cat = D.cat(cxSec(def)); if (!cat) return [];
  const all = def === "lire" ? cxAllItems(def) : CX_KINGS.flatMap(k => D.groups(k.k)).flatMap(g => g.items);
  if (!all.length) return [];
  const out = [];
  for (const it of S.items.values()) {
    if (it.deleted || it.catId !== cat.id || it.ref) continue;
    const f = it.fields || {}; const y = Number(f.anno); if (!y) continue;
    const txt = eur2Norm([it.name, f.valore_nominale, f.nominale, f.catalogo].join(" "));
    const cand = all.filter(x => x.y === y && txt.includes(cxNomKey(x)) && (!x.z || !f.zecca || eur2Norm(f.zecca) === eur2Norm(x.z)));
    if (!cand.length) continue;
    const extra = x => eur2Norm(x.t).split(/[^a-z0-9]+/).slice(2).filter(w => w.length >= 4).filter(w => txt.includes(w)).length;
    const sc = cand.map(x => ({ x, s: extra(x) })).sort((p, q) => q.s - p.s);
    const pick = sc.length === 1 ? sc[0].x : sc[0].s > sc[1].s ? sc[0].x : null;
    if (pick) out.push({ it, x: pick });
  }
  return out;
}

  try { await saveItems(l.map(({ it, x }) => Object.assign({}, it, { ref: { src: D.src, set: def, card: x.id } }))); toast(pl(l.length, "pezzo collegato", "pezzi collegati") + " al catalogo"); render(); } catch (e) { toast(dbErr(e), 5000); }
}
