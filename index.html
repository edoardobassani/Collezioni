<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collezioni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F5F2;--card:#FFFFFF;--line:#E2E2DC;--line2:#EEEEE9;--ink:#17181C;--muted:#5F636B;--acc:#2F5D50;--accbg:#EEF2EF;--up:#1D6B47;--down:#8F3A14;--warnbg:#FBEEE6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:var(--acc)}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 110px}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
h2{margin:0;font-size:15px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}
.xs{font-size:11px}
.b{font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px 16px}
.list>*+*{border-top:1px solid var(--line2)}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;background:none;border:none;text-align:left;cursor:pointer}
.li:hover{background:#FAFAF8}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:38px;height:38px;border-radius:10px;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.ico.solid{background:var(--acc);color:#fff}
.ico.sm{width:32px;height:32px;border-radius:9px}
.ico img{width:100%;height:100%;object-fit:cover}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid #D4D4CE;background:#fff;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:var(--down)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.btn.full{width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:none;background:none;border-radius:12px;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:#ECECE7}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid #D4D4CE;background:#fff;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.seg{display:grid;gap:4px;padding:4px;background:#E9E9E4;border-radius:12px}
.seg button{height:38px;border:none;border-radius:9px;background:transparent;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
label.f{display:flex;flex-direction:column;gap:6px}
label.f>span{font-size:12px;font-weight:500;color:var(--muted)}
.in{height:46px;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 14px;outline:none}
textarea.in{height:auto;min-height:80px;padding:12px 14px;resize:vertical}
.in:focus{border-color:var(--acc)}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--muted)}
.search input{border:none;outline:none;background:transparent;flex:1;min-width:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;font-size:14px}
.kv>span:first-child{color:var(--muted)}
.kv>span:last-child{text-align:right}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--accbg);color:var(--up);white-space:nowrap}
.badge.warn{background:var(--warnbg);color:var(--down)}
.badge.amber{background:#FFF4D6;color:#7A5A00}
.badge.grey{background:#F0F0EC;color:var(--muted)}
.photo{height:220px;border-radius:14px;background:#E9ECE9;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted)}
.photo img{width:100%;height:100%;object-fit:contain;background:#E9ECE9}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:72px;height:72px;border-radius:10px;overflow:hidden;background:#E9ECE9;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:12px;border:none;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.drop{position:relative;display:flex;align-items:center;gap:14px;padding:16px;background:#fff;border:1px dashed #B9BAB3;border-radius:14px;cursor:pointer}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:5}
.nav>div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 0 calc(10px + env(safe-area-inset-bottom))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center;border:none;background:none;font-size:11px;color:var(--muted);cursor:pointer}
.nav button.on{color:var(--acc);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(23,24,28,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:12px 18px calc(24px + env(safe-area-inset-bottom))}
.grab{width:40px;height:4px;border-radius:2px;background:#C9C9C3;margin:0 auto 10px}
.dialog{background:#fff;border-radius:16px;max-width:400px;width:calc(100% - 32px);margin:auto auto;padding:20px}
.overlay.center{align-items:center}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;display:none}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.spark{width:100%;height:56px;display:block}
.progress{height:6px;background:#E9E9E4;border-radius:3px;overflow:hidden}
.progress>div{height:100%;background:var(--acc);transition:width .3s}
.sect{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
.handle{display:flex;flex-direction:column}
.tag{font-size:12px;color:var(--muted);padding:3px 8px;background:#F2F2EE;border-radius:8px}
.notice{padding:12px 14px;border-radius:12px;background:var(--accbg);color:var(--acc);font-size:13px}
.notice.warn{background:var(--warnbg);color:var(--down)}
.hidden{display:none!important}
.fileov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:2}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="empty">Caricamento della collezione…</div></div></div>
<input id="pick_cam" type="file" accept="image/*" capture="environment" data-change="picked" tabindex="-1" aria-hidden="true" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0">
<input id="pick_gal" type="file" accept="image/*" multiple data-change="picked" tabindex="-1" aria-hidden="true" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0">
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ================= Costanti ================= */
const SERVER = "Parallel Search";

  web_search: { type: "object", properties: {

    required: ["urls"] }

const SEARCH_SESSION = "col-" + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2) + Date.now().toString(36);
const ARTIFACT_URL = "https://claude.ai/artifact/JpkhTbPkxorNiivEPpVSJB";
const APP_URL = "https://edoardobassani.github.io/collezioni/";
const CHANNELS = ["Privato", "Asta", "Cardmarket", "eBay", "Subito", "Negozio", "Altro"];
const EXIT_TYPES = { consumato: "Consumato", venduto: "Venduto", regalato: "Regalato", scambiato: "Scambiato" };

/* ================= Icone ================= */
const ICONS = {
  wine: '<path d="M10 2h4v4.5c0 1 .5 1.6 1.3 2.4C16.4 10 17 11.2 17 13v7a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-7c0-1.8.6-3 1.7-4.1.8-.8 1.3-1.4 1.3-2.4z"/><path d="M7 14h10"/>',
  whisky: '<path d="M5 6h14l-1.6 13.2A2 2 0 0 1 15.4 21H8.6a2 2 0 0 1-2-1.8z"/><path d="M6 11h12"/><rect x="9" y="13" width="4" height="4" rx="0.8"/>',
  drinks: '<path d="M8 2h3v3.5c0 .8.4 1.3 1 1.9.9.9 1.4 1.8 1.4 3.2V20a1.5 1.5 0 0 1-1.5 1.5H6.6A1.5 1.5 0 0 1 5 20v-9.4c0-1.4.5-2.3 1.4-3.2.6-.6 1-1.1 1-1.9z"/><path d="M15.5 13h5l-.8 6.7a1.5 1.5 0 0 1-1.5 1.3h-.4a1.5 1.5 0 0 1-1.5-1.3z"/>',
  cardstar: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M12 8.5l1.1 2.3 2.5.3-1.8 1.7.5 2.5-2.3-1.2-2.3 1.2.5-2.5-1.8-1.7 2.5-.3z"/>',
  cardgem: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M12 7.5l3 4.5-3 4.5-3-4.5z"/>',

  coins: '<ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v4c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6"/><path d="M5 10v4c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-4"/><path d="M5 14v4c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-4"/>',
  book: '<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19"/><path d="M9 7h6"/>',
  film: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4"/>',
  die: '<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/>',
  gamepad: '<path d="M7 8h10a4 4 0 0 1 4 4v1.5a3.5 3.5 0 0 1-6.3 2.1L14 15h-4l-.7.6A3.5 3.5 0 0 1 3 13.5V12a4 4 0 0 1 4-4z"/><path d="M8 10.5v3M6.5 12h3"/><circle cx="16" cy="12" r="0.8" fill="currentColor"/>',
  coin: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5.5"/>',
  ancient: '<path d="M12 3c4.8 0 8.7 3.6 9 8.3.3 5-3.6 9.5-8.9 9.7C6.9 21.2 3 17.4 3 12.4 3 7.2 7 3 12 3z"/><circle cx="12" cy="12" r="5.5" stroke-dasharray="1 2"/>',
  crowncoin: '<circle cx="12" cy="12" r="8.5"/><path d="M8.4 14.6h7.2l.8-5.1-2.7 2-1.7-3-1.7 3-2.7-2z"/>',
  box: '<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>',
  vinyl: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/><path d="M12 6.5a5.5 5.5 0 0 1 5.5 5.5"/>',
  watch: '<rect x="7" y="7" width="10" height="10" rx="2.5"/><path d="M9 7l.7-4h4.6l.7 4M9 17l.7 4h4.6l.7-4"/>',
  star: '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
  gem: '<path d="M6 4h12l3 5-9 11L3 9z"/><path d="M3 9h18M9.5 4 12 20l2.5-16"/>',

  envelope: '<rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 6.5 12 13l8.5-6.5"/><rect x="15" y="8.5" width="3.5" height="4" rx="0.3" stroke-dasharray="1 1"/>',
  globe: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.2 3.6 8.5s-1.2 6.2-3.6 8.5c-2.4-2.3-3.6-5.2-3.6-8.5s1.2-6.2 3.6-8.5z"/>',
  camera2: '<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  // icone interfaccia
  camera: '<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  refresh: '<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  up: '<path d="M6 15l6-6 6 6"/>',
  right: '<path d="M9 6l6 6-6 6"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  grid: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  bookmark: '<path d="M7 3h10v18l-5-3.5L7 21z"/>',
  download: '<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M4 17v3h16v-3"/>',
  upload: '<path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 17v3h16v-3"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  image: '<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 16l-5-5-8 8"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  filter: '<path d="M4 6h16M7 12h10M10 18h4"/>',

};
const CAT_ICON_KEYS = ["wine", "whisky", "drinks", "cardstar", "cardgem", "cards", "stamp", "coins", "coin", "crowncoin", "ancient", "stampold", "envelope", "globe", "book", "film", "die", "gamepad", "box", "vinyl", "watch", "star", "gem", "comic"];
function ic(k, s = 20, sw = 1.7) {
  return '<svg aria-hidden="true" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + sw + '" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[k] || ICONS.box) + '</svg>';
}
function iconHtml(icon, s = 20) {
  if (icon && String(icon).startsWith("asset:")) return '<img alt="" src="' + photoSrc(String(icon).slice(6)) + '">';
  return ic(icon || "box", s, 1.6);
}

/* ================= Utilità ================= */
function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function uid(p = "i") { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function nowIso() { return new Date().toISOString(); }
function fmtDate(s) { if (!s) return "—"; const d = new Date(s.length <= 10 ? s + "T12:00:00" : s); return isNaN(d) ? s : d.toLocaleDateString("it-IT", { day: "numeric", month: "short", year: "numeric" }); }
function eur(n) {
  if (n == null || n === "" || isNaN(n)) return "—";
  const v = Number(n);
  return new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", minimumFractionDigits: 0, maximumFractionDigits: Math.abs(v) < 100 ? 2 : 0 }).format(v);
}
function signedEur(n) { if (n == null || isNaN(n)) return "—"; return (n > 0 ? "+ " : n < 0 ? "− " : "") + eur(Math.abs(n)); }
function parseNum(s) {
  if (s == null) return null;
  let t = String(s).trim().replace(/[€\s]/g, "");
  if (!t) return null;
  if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
  const n = Number(t);
  return isFinite(n) ? n : null;
}
function numIn(n) { return n == null || isNaN(n) ? "" : String(n).replace(".", ","); }
function slug(s) { return (String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 24) || "cat") + "-" + Math.random().toString(36).slice(2, 6); }
function toast(msg, ms = 2800) { const t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = "none"; }, ms); }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
function $(id) { return document.getElementById(id); }
function val(id) { const el = $(id); return el ? el.value : ""; }

/* ================= Stato ================= */
const S = {
  db: null, user: null, sample: null, mcp: null, assets: null, downloads: null,
  config: null, configLoaded: false, chunks: {}, items: new Map(), subs: {},
  view: { name: "home" }, stack: [], open: lsGet("col.open", {}),
  loadErr: null, slow: false, dirty: false, busy: false,
  catState: {}, scan: null, quote: null, imp: null, draft: null
};
const FORM_VIEWS = new Set(["itemForm", "catForm", "groupForm", "scan", "quote", "backup"]);

/* ================= Avvio ================= */
async function boot() {
  if (!window.claude || !window.claude.use) { return bootLocal(); }
  S.env = "artifact";
  const slowT = setTimeout(() => { S.slow = true; render(); }, 10000);
  try { S.db = await claude.use("db"); } catch (e) { S.db = null; }
  if (!S.db) { clearTimeout(slowT); S.loadErr = "L'archivio non è disponibile in questa vista. Apri l'artifact da Claude con il tuo account."; render(); return; }
  claude.use("user").then(u => { S.user = u; }).catch(() => { });
  claude.use("sample").then(s => { S.sample = s; render(); }).catch(() => { });
  claude.use("mcp").then(m => { S.mcp = m; }).catch(() => { });
  claude.use("assets").then(a => { S.assets = a; }).catch(() => { });
  claude.use("downloads").then(d => { S.downloads = d; }).catch(() => { });
  S.db.doc("config/main").onSnapshot(snap => {
    clearTimeout(slowT); S.slow = false;
    const first = !S.configLoaded;
    S.configLoaded = true;
    S.config = snap.exists ? normConfig(snap.data()) : null;
    syncSubs();
    if (first && String(location.hash || "") === "#review" && S.config && S.config.cats.length) { S.fromApp = true; S.rai = { mode: "flagged", catId: "", web: false, sel: new Set(), step: "pick", results: [], awaitApp: true }; S.stack = [{ name: "home" }]; S.view = { name: "reviewAi" }; render(); return; }
    if (first && String(location.hash || "") === "#scan" && S.config && S.config.cats.length) { S.fromApp = true; S.scan = { step: "pick", files: [], urls: [], catId: "auto", results: [] }; S.stack = [{ name: "home" }]; S.view = { name: "scan" }; render(); return; }
    softRender();
  }, err => { clearTimeout(slowT); S.loadErr = "Non riesco a leggere l'archivio (" + err.code + ")."; render(); });
  subHistory();
}

function normConfig(c) {
  const cfg = JSON.parse(JSON.stringify(c || {}));
  cfg.groups = Array.isArray(cfg.groups) ? cfg.groups : [];
  cfg.cats = Array.isArray(cfg.cats) ? cfg.cats : [];
  cfg.cats.forEach(k => { k.fields = Array.isArray(k.fields) ? k.fields : []; k.cond = Array.isArray(k.cond) && k.cond.length ? k.cond : ["Nuovo", "Ottimo", "Buono", "Discreto", "Rovinato"]; });
  return cfg;
}

function syncSubs() {
  const ids = new Set((S.config ? S.config.cats : []).map(c => c.id));
  for (const id of Object.keys(S.subs)) if (!ids.has(id)) { S.subs[id](); delete S.subs[id]; delete S.chunks[id]; rebuildItems(id); }
  for (const id of ids) {
    if (S.subs[id]) continue;
    S.subs[id] = S.db.collection("cats/" + id + "/chunks").onSnapshot(snap => {
      const m = {};
      snap.docs.forEach(d => { m[d.id] = d.data(); });
      S.chunks[id] = m;
      S.loadedCats = S.loadedCats || new Set(); S.loadedCats.add(id);
      rebuildItems(id);
      scheduleSnapshot();
      softRender();
    }, err => { toast("Errore nel leggere una categoria (" + err.code + ")"); });
  }
}

function rebuildItems(catId) {
  for (const [k, it] of S.items) if (it.catId === catId) S.items.delete(k);
  const ch = S.chunks[catId] || {};
  for (const [cid, doc] of Object.entries(ch)) {
    const its = (doc && doc.items) || {};
    for (const [id, it] of Object.entries(its)) {
      if (!it || typeof it !== "object") continue;
      const copy = JSON.parse(JSON.stringify(it));
      copy.id = id; copy.catId = catId; copy._chunk = cid;
      S.items.set(id, copy);
    }
  }
}

function softRender() { if (FORM_VIEWS.has(S.view.name)) { S.dirty = true; return; } render(); }

/* ================= Storico del valore ================= */
function subHistory() {
  S.hist = S.hist || {};
  S.db.doc("stats/history").onSnapshot(snap => {
    S.histExists = snap.exists;
    S.hist = (snap.exists && snap.data().days) || {};
    S.histLoaded = true;
    scheduleSnapshot();
    softRender();
  }, () => { S.histLoaded = true; });
}
function currentTotals() {
  const c = {}; let t = 0, n = 0;
  for (const it of S.items.values()) {
    if (it.deleted || it.status !== "in") continue;
    const v = itemTotal(it); c[it.catId] = Math.round(((c[it.catId] || 0) + v) * 100) / 100; t += v; n += Number(it.qty) || 0;
  }
  return { t: Math.round(t * 100) / 100, n, c };
}
function scheduleSnapshot() { clearTimeout(S._snapT); S._snapT = setTimeout(takeSnapshot, 4000); }
async function takeSnapshot() {
  if (!S.histLoaded || !S.config || !S.config.cats.length) return;
  const loaded = S.loadedCats || new Set();
  if (S.config.cats.some(c => !loaded.has(c.id))) return;
  const cur = currentTotals();
  if (!cur.n) return;
  const d = today();
  const prev = S.hist[d];
  if (prev && prev.t === cur.t && prev.n === cur.n && JSON.stringify(prev.c || {}) === JSON.stringify(cur.c)) return;
  try {
    await enqueue(async () => {
      const ref = S.db.doc("stats/history");
      if (S.histExists) await ref.update({ days: { [d]: cur } }); else { await ref.set({ days: { [d]: cur } }); S.histExists = true; }
    });
    S.hist[d] = cur;
  } catch (e) { }
}
function histSeries(catId, period) {
  const days = Object.keys(S.hist || {}).sort();
  const from = period === "all" ? "" : new Date(Date.now() - ({ "1m": 31, "6m": 183, "1y": 366 }[period] || 31) * 864e5).toISOString().slice(0, 10);
  return days.filter(d => d >= from).map(d => ({ d, v: catId ? ((S.hist[d].c || {})[catId] || 0) : S.hist[d].t })).filter(p => p.v != null);
}
function valueChart(pts, h) {
  h = h || 120;
  if (pts.length < 2) return '<div class="xs muted" style="padding:8px 0">Il grafico si riempie giorno dopo giorno: ogni giorno in cui apri l\'app o aggiorni i prezzi viene salvato il valore.</div>';
  const vs = pts.map(p => p.v), mn = Math.min(...vs), mx = Math.max(...vs), rg = (mx - mn) || Math.max(1, mx * 0.05);
  const t0 = new Date(pts[0].d).getTime(), t1 = new Date(pts[pts.length - 1].d).getTime(), tr = (t1 - t0) || 1;
  const X = p => ((new Date(p.d).getTime() - t0) / tr * 300).toFixed(1), Y = v => (h - 14 - (v - mn) / rg * (h - 28)).toFixed(1);
  const line = pts.map((p, i) => (i ? "L" : "M") + X(p) + " " + Y(p.v)).join(" ");
  const up = vs[vs.length - 1] >= vs[0];
  const col = up ? "#2F5D50" : "#8F3A14";
  return '<svg role="img" aria-label="Andamento del valore dal ' + fmtDate(pts[0].d) + ' al ' + fmtDate(pts[pts.length - 1].d) + '" viewBox="0 0 300 ' + h + '" preserveAspectRatio="none" style="width:100%;height:' + h + 'px;display:block"><path d="' + line + ' L300 ' + (h - 14) + ' L0 ' + (h - 14) + ' Z" fill="' + col + '" fill-opacity=".08"/><path d="' + line + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><div class="between xs muted"><span>' + fmtDate(pts[0].d) + '</span><span>min ' + eur(mn) + ' · max ' + eur(mx) + '</span><span>' + fmtDate(pts[pts.length - 1].d) + '</span></div>';
}
function histBox(catId) {
  const per = S.histPeriod || "1m";
  const pts = histSeries(catId, per);
  let h = '<div class="card pad stack" style="gap:8px">';
  if (pts.length >= 2) {
    const dv = pts[pts.length - 1].v - pts[0].v, pc = pts[0].v ? dv / pts[0].v * 100 : 0;
    h += '<div class="between"><span class="small b ' + (dv >= 0 ? "up" : "down") + '">' + signedEur(dv) + ' (' + (pc >= 0 ? "+" : "−") + Math.abs(pc).toFixed(1).replace(".", ",") + '%)</span><span class="xs muted">nel periodo</span></div>';
  }
  h += valueChart(pts, catId ? 80 : 110);
  h += '<div class="chips">' + [["1m", "1 mese"], ["6m", "6 mesi"], ["1y", "1 anno"], ["all", "Tutto"]].map(([k, l]) => '<button type="button" class="chip ' + (per === k ? "on" : "") + '" style="height:30px" data-act="histPeriod" data-v="' + k + '">' + l + '</button>').join("") + '</div></div>';
  return h;
}

/* ================= Accesso dati ================= */
function cat(id) { return S.config && S.config.cats.find(c => c.id === id); }
function group(id) { return S.config && S.config.groups.find(g => g.id === id); }
function catItems(catId) { return [...S.items.values()].filter(i => i.catId === catId && !i.deleted); }
function activeItems() { return [...S.items.values()].filter(i => !i.deleted && i.status === "in"); }
function itemTotal(i) { return (Number(i.value) || 0) * (Number(i.qty) || 0); }
function sumVal(list) { return list.reduce((a, i) => a + (i.status === "in" ? itemTotal(i) : 0), 0); }
function sumQty(list) { return list.reduce((a, i) => a + (i.status === "in" ? (Number(i.qty) || 0) : 0), 0); }

let wq = Promise.resolve();
function enqueue(fn) { const p = wq.then(fn); wq = p.catch(() => { }); return p; }

function cleanItem(it) {
  const o = {};
  const keys = ["name", "qty", "cond", "status", "value", "valueLow", "valueHigh", "valueDate", "valueSource", "valueUrl", "valueConf", "buyPrice", "buyKind", "buyDate", "buyFrom", "location", "tags", "notes", "fields", "photos", "movements", "valueHistory", "createdAt", "updatedAt", "deleted", "remainingMl", "capacityMl", "ref", "imageUrl"];
  for (const k of keys) o[k] = it[k] === undefined ? null : it[k];
  for (const k of Object.keys(it)) if (!(k in o) && k[0] !== "_" && k !== "id" && k !== "catId" && it[k] !== undefined) o[k] = it[k];
  o.fields = it.fields || {};
  o.photos = it.photos || [];
  o.movements = it.movements || [];
  o.valueHistory = (it.valueHistory || []).slice(-HIST_MAX);
  o.deleted = !!it.deleted;
  return o;
}

function chunkCounts(catId) {
  const out = {};
  for (const [cid, doc] of Object.entries(S.chunks[catId] || {})) out[cid] = Object.keys((doc && doc.items) || {}).length;
  return out;
}
function pickChunk(catId, counts) {
  const ids = Object.keys(counts).sort();
  for (const id of ids) if (counts[id] < CHUNK_MAX) return id;
  let n = ids.length + 1, id;
  do { id = "c" + String(n).padStart(3, "0"); n++; } while (counts[id] != null);
  counts[id] = 0;
  return id;
}

/* Salva più pezzi raggruppandoli per blocco: una scrittura per blocco */
async function saveItems(list) {
  const groups = {};
  const counts = {};
  const moves = [];
  for (const raw of list) {
    const it = Object.assign({}, raw);
    it.updatedAt = nowIso();
    const prev = S.items.get(it.id);
    let chunk = null;
    if (prev && prev.catId === it.catId) chunk = prev._chunk;
    if (prev && prev.catId !== it.catId) moves.push({ catId: prev.catId, chunk: prev._chunk, id: it.id });
    if (!chunk) {
      if (!counts[it.catId]) counts[it.catId] = chunkCounts(it.catId);
      chunk = pickChunk(it.catId, counts[it.catId]);
      counts[it.catId][chunk] = (counts[it.catId][chunk] || 0) + 1;
    }
    const key = it.catId + "/" + chunk;
    (groups[key] = groups[key] || { catId: it.catId, chunk, items: {} }).items[it.id] = cleanItem(it);
  }
  for (const g of Object.values(groups)) {
    await enqueue(async () => {
      const ref = S.db.doc("cats/" + g.catId + "/chunks/" + g.chunk);
      const exists = S.chunks[g.catId] && S.chunks[g.catId][g.chunk];
      if (exists) await ref.update({ items: g.items });
      else await ref.set({ items: g.items });
    });
  }
  for (const m of moves) {
    await enqueue(async () => {
      const doc = S.chunks[m.catId] && S.chunks[m.catId][m.chunk];
      if (!doc) return;
      const items = Object.assign({}, doc.items || {});
      delete items[m.id];
      await S.db.doc("cats/" + m.catId + "/chunks/" + m.chunk).set({ items });
    });
  }
}
async function saveItem(it) { return saveItems([it]); }

async function saveConfig(cfg) {
  cfg.updatedAt = nowIso();
  const clean = JSON.parse(JSON.stringify(cfg));
  await enqueue(() => S.db.doc("config/main").set(clean));
}

function dbErr(e) {
  const c = e && e.code;
  if (c === "quota_exceeded") return "Spazio dell'archivio esaurito: " + (e.message || "");
  if (c === "invalid_argument") return "Salvataggio rifiutato: non hai i permessi di scrittura o i dati non sono validi.";
  if (c === "resource_exhausted") return "Troppe operazioni ravvicinate, riprova tra poco.";
  return "Salvataggio non riuscito (" + (c || "errore") + ").";
}

/* ================= Elenco categoria ================= */
function itemSubtitle(it, c) {
  const parts = [];
  (c ? c.fields : []).slice(0, 3).forEach(f => { const v = it.fields && it.fields[f.k]; if (v !== undefined && v !== null && v !== "" && v !== false) parts.push(f.type === "bool" ? f.label : String(v)); });
  return parts.join(" · ");
}
function searchText(it) { return (it.name + " " + Object.values(it.fields || {}).join(" ") + " " + (it.tags || "") + " " + (it.notes || "") + " " + (it.location || "")).toLowerCase(); }
function vCat(id) {

function sparkline(hist) {
  const pts = (hist || []).filter(p => p && p.v != null);
  if (pts.length < 2) return '';
  const vs = pts.map(p => p.v), mn = Math.min(...vs), mx = Math.max(...vs), rg = mx - mn || 1;
  const d = pts.map((p, i) => (i ? "L" : "M") + (i / (pts.length - 1) * 320).toFixed(1) + " " + (50 - (p.v - mn) / rg * 42).toFixed(1)).join(" ");
  const up = vs[vs.length - 1] >= vs[0];
  return '<svg class="spark" role="img" aria-label="Andamento del valore, ' + (up ? "in crescita" : "in calo") + '" viewBox="0 0 320 56" preserveAspectRatio="none"><path d="' + d + '" fill="none" stroke="' + (up ? "#2F5D50" : "#8F3A14") + '" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M0 55.5H320" stroke="#E2E2DC"/></svg>';
}

    if (it.status === "in") it.movements = [{ type: "carico", qty: it.qty, date: it.buyDate || today(), price: it.buyPrice != null ? it.buyPrice * it.qty : null }];

    if (top && top.name === "item" && top.id === it.id) S.stack.pop();

}

async function compressImage(file, max = 1280, q = 0.82) {
  try {
    const bmp = await createImageBitmap(file);
    const r = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas");

function exitCalcHtml() {

async function exitSave() {
  const e = S.exit; const it = Object.assign({}, S.items.get(e.id));

    keepExit();
    let mlTo;
    if (e.mode === "cl") {
      if (!e.cl || e.cl <= 0) { toast("Indica quanti cl hai versato."); return; }
      mlTo = Math.max(0, e.remFrom - e.cl * 10);
    } else {
      if (!e.level) { toast("Scegli quanto ne resta."); return; }
      mlTo = e.cap * levelFrac(e.level);
    }
    mlTo = Math.round(mlTo);
    const finished = mlTo <= 0;
    const fromLvl = (it.fields && it.fields.livello) || "Piena";
    const toLvl = finished ? "Finita" : levelFromFrac(mlTo / e.cap);
    const m = { type: "consumato", part: true, qty: finished ? 1 : 0, levelFrom: fromLvl, levelTo: toLvl, mlFrom: Math.round(e.remFrom), mlTo, ml: Math.round(e.remFrom - mlTo), date: e.date || today(), note: e.note || "" };

    it.fields = Object.assign({}, it.fields || {});
    if (e.capAsk) it.capacityMl = e.cap;
    if (finished) {
      it.qty = it.qty - 1;
      it.fields.livello = "Piena";
      it.remainingMl = null;
      if (it.cond === "Aperta") it.cond = "Sigillata";

    } else {
      it.fields.livello = toLvl;
      it.remainingMl = mlTo;
      const c = cat(it.catId);
      if (c && c.cond.includes("Aperta")) it.cond = "Aperta";
    }
    try { await saveItem(it); closeModal(); toast(finished ? "Bottiglia finita" : "Restano " + fmtCl(mlTo)); render(); } catch (err) { toast(dbErr(err), 4500); }
    return;
  }

  if (e.type === "venduto") { m.price = parseNum(val("x_price")); m.fees = parseNum(val("x_fees")); m.channel = val("x_channel"); m.cost = it.buyPrice != null ? it.buyPrice * qty : null; m.costKind = it.buyKind; }
  if (e.type === "consumato") { const r = parseInt(val("x_rating"), 10); if (r) m.rating = Math.min(10, Math.max(1, r)); }

}

async function getSearchTools(statusCb) {
  const res = { tools: [], status: "none" };
  if (!S.mcp) { res.status = "nomcp"; return res; }
  let lim = null;
  try { lim = await S.sample.limits(); } catch (e) { }
  if (!lim || !lim.tools) { res.status = "notools"; return res; }
  let srv = null;
  try { const lt = await S.mcp.listTools(SERVER); srv = (lt.servers || []).find(x => x.server === SERVER); } catch (e) { }
  if (!srv || !(srv.tools || []).length) { res.status = "notconnected"; return res; }
  if (srv.authStatus === "needs_reauth") { res.status = "reauth"; return res; }
  const names = ["web_search", "web_fetch"].filter(n => srv.tools.some(t => t.name === n));
  for (const name of names.slice(0, (lim.tools.maxCount || 2))) {
    let schema = null;
    try { const d = await S.mcp.describeTool(SERVER, name); schema = d && d.inputSchema; } catch (e) { }
    if (!schema || schema.type !== "object" || JSON.stringify(schema).length > 3900) schema = FALLBACK_SCHEMAS[name];
    const info = srv.tools.find(t => t.name === name) || {};
    const desc = (info.description || (name === "web_search" ? "Cerca sul web e restituisce estratti dei risultati con i link." : "Legge il contenuto delle pagine web indicate.")).slice(0, 900);
    res.tools.push({
      name, description: desc, inputSchema: schema,
      execute: async (input, ctx) => {
        if (statusCb) statusCb(name === "web_search" ? "Cerco: " + String((input && (input.objective || (input.search_queries || [])[0] || input.query)) || "").slice(0, 80) : "Leggo una pagina");
        try {
          const args = Object.assign({}, input || {}, { session_id: SEARCH_SESSION });
          const r = await S.mcp.callTool(SERVER, name, args, { signal: ctx.signal, cache: false });
          const out = r.payload !== undefined ? r.payload : r.content;
          return (typeof out === "string" ? out : JSON.stringify(out)).slice(0, 24000);
        } catch (e) {
          if (e && (e.code === "needs_reauth" || e.code === "server_not_connected")) res.status = e.code;
          throw new Error((e && e.code ? e.code + ": " : "") + (e && e.message ? e.message : "errore della ricerca"));
        }
      }
    });
  }
  res.status = res.tools.length ? "ok" : "notconnected";
  return res;
}

function quoteStats() {

function analyzeImport(text, name) {

        const ref = S.db.doc("cats/" + g.catId + "/chunks/" + g.chunk);
        const exists = S.chunks[g.catId] && S.chunks[g.catId][g.chunk];
        if (exists) await ref.update({ items: g.items }); else await ref.set({ items: g.items });
      });
    }
    toast(items.length ? "Importati " + items.length + " pezzi" + (newer ? " e categorie aggiornate" : "") : (newer ? "Categorie aggiornate" : "Nessun pezzo nuovo"));
    S.imp = null;
    if (S.env === "pwa") setTimeout(() => linkAll(false), 800);

/* ================= Revisione dati ================= */
const REV_SEV = { err: { label: "Errore", cls: "warn", sect: "Errori" }, warn: { label: "Controlla", cls: "amber", sect: "Da controllare" }, tip: { label: "Suggerimento", cls: "", sect: "Suggerimenti" } };
const REV_ORDER = { err: 0, warn: 1, tip: 2 };
const RAI_MAX = 60;
function revYear() { return new Date().getFullYear(); }
function fv(it, k) { return it.fields ? it.fields[k] : undefined; }
function numF(it, k) { const v = fv(it, k); if (v === "" || v == null) return null; const n = typeof v === "number" ? v : parseNum(String(v)); return n == null || isNaN(n) ? null : n; }
function revIgnored(it, key) { return !!(it && (it.reviewIgnore || []).includes(key)); }

/* --- livello 1: coerenza, senza rete --- */
function reviewLocal() {
  const out = [];
  const Y = revYear();
  const add = (it, key, sev, text, extra) => {
    if (revIgnored(it, key)) return;
    out.push(Object.assign({ key, sev, text, itemId: it.id, catId: it.catId, uid: it.id + "|" + key }, extra || {}));
  };
  const items = [...S.items.values()].filter(i => !i.deleted && cat(i.catId));
  for (const it of items) {
    const c = cat(it.catId);
    const live = it.status !== "out";
    if (!String(it.name || "").trim()) add(it, "noname", "err", "Manca il nome.");
    c.fields.forEach(f => {
      if (f.type === "number" && /^(anno|annata)$/.test(f.k)) {
        const y = numF(it, f.k);
        if (y != null && y > Y) add(it, "future:" + f.k, "err", f.label + " " + y + ": è nel futuro.", { fix: null });
        else if (y != null && y < 1000 && it.catId !== "monete-antiche") add(it, "short:" + f.k, "warn", f.label + " " + y + ": sembra mancare una cifra.");
      }
      if (f.type === "select" && f.options.length) {
        const v = fv(it, f.k);
        if (v != null && v !== "" && !f.options.includes(String(v))) add(it, "opt:" + f.k, "tip", f.label + ": \"" + v + "\" non è tra le voci previste.");
      }
    });
    if (it.cond && c.cond.length && !c.cond.includes(it.cond)) add(it, "cond", "tip", "Stato \"" + it.cond + "\" non è tra quelli previsti per " + c.name + ".");
    const anno = numF(it, "anno");
    if (it.catId === "francobolli-antichi" && anno != null && anno > 1862) add(it, "rule:antichi", "err", "Anno " + anno + " per un francobollo degli Antichi Stati (fino al 1861).");
    if (it.catId === "francobolli" && anno != null) {
      const p = String(fv(it, "periodo") || "");
      if (/^Regno/.test(p) && anno > 1946) add(it, "rule:regno", "err", "Anno " + anno + " ma periodo Regno d'Italia (fino al 1946).");
      if (/^Repubblica/.test(p) && anno < 1946) add(it, "rule:rep", "err", "Anno " + anno + " ma periodo Repubblica (dal 1946).");
      if (/^RSI/.test(p) && (anno < 1943 || anno > 1946)) add(it, "rule:rsi", "warn", "Anno " + anno + " fuori dal periodo RSI / Luogotenenza (1943–1946).");
    }
    if (it.catId === "monete-storiche" && anno != null && anno > 1960) add(it, "rule:storica", "warn", "Anno " + anno + ": sembra una moneta moderna, non storica.");
    if (it.catId === "monete" && anno != null && anno < 1900) add(it, "rule:moderna", "warn", "Anno " + anno + ": sembra una moneta storica, non moderna.");
    if (it.catId === "vini") {
      const an = numF(it, "annata"), da = numF(it, "bere_da"), en = numF(it, "bere_entro");
      if (da != null && en != null && en < da) add(it, "rule:bere", "err", "Da bere entro il " + en + ", prima di \"da bere dal\" " + da + ".");
      if (an != null && da != null && da < an) add(it, "rule:bereann", "err", "Da bere dal " + da + ", prima dell'annata " + an + ".");
      if (live && en != null && en < Y) add(it, "rule:scaduto", "tip", "Da bere entro il " + en + ": la finestra è già passata.");
    }
    if (live && Number(it.qty) <= 0) add(it, "qty0", "err", "Quantità 0 ma risulta in collezione.");
    if (it.remainingMl != null && it.capacityMl != null && it.remainingMl > it.capacityMl) add(it, "ml", "err", "Restano " + fmtCl(it.remainingMl) + " su una bottiglia da " + fmtCl(it.capacityMl) + ".");
    if (c.consumable && it.cond === "Sigillata" && fv(it, "livello") && fv(it, "livello") !== "Piena") add(it, "sealed", "warn", "Bottiglia sigillata ma livello \"" + fv(it, "livello") + "\".");
    (it.movements || []).forEach((m, j) => { if (m.type === "venduto" && m.price == null) add(it, "soldnoprice:" + j, "warn", "Venduto il " + fmtDate(m.date) + " senza prezzo di vendita."); });
    if (live && it.buyPrice > 0 && it.value > 0 && it.buyKind !== "stimato") {
      const r = it.buyPrice / it.value;
      const cmp = [["Prezzo d'acquisto", eur(it.buyPrice) + " (reale)", ""], ["Quotazione", eur(it.value) + (it.valueDate ? " · " + fmtDate(it.valueDate) : ""), ""]];
      if (r > 2.5) add(it, "buyhigh", "warn", "Pagato " + eur(it.buyPrice) + ", quotazione " + eur(it.value) + ": oltre il doppio.", { info: cmp, note: "Può essere giusto (edizione particolare, acquisto in negozio) oppure un errore di battitura." });
      else if (r < 0.25) add(it, "buylow", "warn", "Pagato " + eur(it.buyPrice) + ", quotazione " + eur(it.value) + ": molto meno della quotazione.", { info: cmp, note: "Controlla prezzo e quotazione: uno dei due potrebbe essere sbagliato." });
    }
  }
  // doppioni
  const byKey = {};
  items.filter(i => i.status !== "out").forEach(i => {
    const f = i.fields || {};
    const k = [i.catId, normTxt(i.name), i.cond || "", i.status, JSON.stringify(Object.keys(f).sort().map(x => [x, f[x]]))].join("|");
    (byKey[k] = byKey[k] || []).push(i);
  });
  Object.values(byKey).forEach(g => {
    if (g.length < 2) return;
    const first = g[0];
    if (g.some(x => revIgnored(x, "dup"))) return;
    const q = g.reduce((a, x) => a + (Number(x.qty) || 0), 0);
    add(first, "dup", "warn", "Possibile doppione: " + g.length + " schede uguali.", { fix: { type: "merge", ids: g.map(x => x.id), label: "Unisci (qtà " + q + ")" }, ignoreLabel: "Sono diverse", dupIds: g.map(x => x.id) });
  });
  return out;
}
/* segnalazioni riassuntive (non legate a un singolo pezzo) */
function reviewAgg() {
  const out = [];
  const live = activeItems();
  const noPhoto = live.filter(i => !(i.photos || []).length && !i.imageUrl);
  if (noPhoto.length) out.push({ agg: true, sev: "tip", uid: "agg|nophoto", title: noPhoto.length + " pezzi senza foto", text: "Con la foto la verifica con Claude è molto più precisa.", ids: noPhoto.map(i => i.id), act: "reviewList", actLabel: "Vedi" });
  const limit = new Date(Date.now() - 180 * 864e5).toISOString().slice(0, 10);
  const old = live.filter(i => !i.value || !i.valueDate || i.valueDate < limit);
  if (old.length) out.push({ agg: true, sev: "tip", uid: "agg|oldq", title: old.length + " pezzi senza quotazione recente", text: "Nessuna quotazione o più vecchia di 6 mesi.", ids: old.map(i => i.id), act: S.env === "artifact" ? "quoteStart" : "reviewList", actLabel: S.env === "artifact" ? "Aggiorna" : "Vedi" });
  if (S.env === "pwa") {
    const unl = catalogCats().flatMap(c => unlinked(c.id));
    if (unl.length) out.push({ agg: true, sev: "tip", uid: "agg|unlinked", title: unl.length + " carte non collegate al catalogo", text: "Senza collegamento non contano nel completamento e non hanno prezzi automatici.", ids: unl.map(i => i.id), act: "reviewLink", actLabel: "Collega" });
  }
  return out;
}
function reviewAll() {
  const R = S.review || (S.review = {});
  if (!R.local) reviewRefresh(true);
  const catIss = ((R.cat && R.cat.issues) || []).filter(x => { const it = S.items.get(x.itemId); return it && !it.deleted && !revIgnored(it, x.key); });
  return [...R.local, ...catIss, ...R.agg].sort((a, b) => REV_ORDER[a.sev] - REV_ORDER[b.sev]);
}
function reviewRefresh(silent) {
  const R = S.review || (S.review = {});
  R.local = reviewLocal(); R.agg = reviewAgg(); R.at = nowIso();
  if (S.env === "pwa" && !silent) setTimeout(reviewPrepPack, 0);
}
function reviewFiltered() {
  const R = S.review;
  return reviewAll().filter(x => (!R.f || R.f === "all" || x.sev === R.f) && (!R.cat_f || x.catId === R.cat_f || (x.agg && !R.cat_f)));
}
function reviewCounts() { const all = reviewAll(); const n = s => all.filter(x => x.sev === s).length; return { err: n("err"), warn: n("warn"), tip: n("tip"), all: all.length }; }

/* --- livello 2: cataloghi online (solo app) --- */
async function reviewCatalog() {
  const R = S.review;
  if (S.env !== "pwa") return;
  if (!navigator.onLine) { toast("Serve la connessione per confrontare con i cataloghi."); return; }
  R.catBusy = true; R.catMsg = "Avvio…"; render();
  const out = []; let nCards = 0, nBooks = 0;
  const add = (it, key, sev, text, extra) => { if (!revIgnored(it, key)) out.push(Object.assign({ key, sev, text, itemId: it.id, catId: it.catId, uid: it.id + "|" + key, src: "cat" }, extra || {})); };
  const say = t => { R.catMsg = t; const el = $("revCatMsg"); if (el) el.textContent = t; };
  try {
    for (const c of catalogCats()) {
      const src = catalogOf(c.id);
      const list = catItems(c.id).filter(i => i.ref && i.ref.card);
      if (!list.length) continue;
      nCards += list.length;
      let prices = {};
      try { prices = await fetchPrices(src, list.map(i => i.ref), (i, n) => say(c.name + ": " + i + " di " + n)); } catch (e) { }
      const sets = {};
      for (const it of list) {
        const r = it.ref, f = it.fields || {};
        const srcName = src === "tcgdex" ? "TCGdex" : "Scryfall";
        if (f.numero && r.num && normNum(f.numero) !== normNum(r.num)) add(it, "cat:num", "err", "Il numero nella scheda (" + f.numero + ") non corrisponde alla carta collegata (" + r.num + ").", { cmp: [["Numero", f.numero, r.num]], fix: { type: "fields", set: { numero: String(r.num) }, label: "Applica \"" + r.num + "\"" }, srcName });
        const p = prices[r.card];
        const lab = p && rarityLabel(src, p.rarity);
        if (lab && f.rarita && lab !== f.rarita) add(it, "cat:rar", src === "scryfall" ? "err" : "warn", "Nel catalogo la rarità è \"" + lab + "\", nella scheda c'è \"" + f.rarita + "\".", { cmp: [["Rarità", f.rarita, lab]], fix: { type: "fields", set: { rarita: lab }, label: "Applica \"" + lab + "\"" }, srcName });
        if (!/ital/i.test(String(f.lingua || ""))) {
          if (!(r.set in sets)) { try { sets[r.set] = await loadSetCards(src, r.set, "en"); } catch (e) { sets[r.set] = null; } }
          const card = sets[r.set] && sets[r.set].cards.find(x => x.id === r.card);
          const cn = card && (card.nameEn || card.name);
          const nm = normTxt(it.name);
          if (cn && nm && normTxt(cn) !== nm && !nm.includes(normTxt(cn)) && !normTxt(cn).includes(nm)) add(it, "cat:name", "warn", "Nel catalogo questa carta si chiama \"" + cn + "\".", { cmp: [["Nome", it.name, cn], ["Set", f.set || "—", sets[r.set].name], ["Numero", f.numero || "—", r.num]], fix: { type: "name", v: cn, label: "Usa \"" + cn + "\"" }, srcName });
        }
      }
    }
    const books = [...S.items.values()].filter(i => !i.deleted && i.fields && i.fields.isbn);
    nBooks = books.length;
    let done = 0;
    await pool(books.slice(0, 200), 4, async it => {
      const code = cleanCode(it.fields.isbn);
      say("Libri: " + (++done) + " di " + Math.min(200, books.length));
      if (!isIsbn(code)) { add(it, "isbn:bad", "warn", "ISBN \"" + it.fields.isbn + "\" non valido (lunghezza o cifre)."); return; }
      let b = cacheGet("isbn." + code, 30 * 864e5);
      if (!b) { b = await lookupBook(code); if (b) cacheSet("isbn." + code, b); }
      if (!b) { add(it, "isbn:none", "tip", "ISBN non trovato in Google Books né in Open Library."); return; }
      const t1 = normTxt(it.name), t2 = normTxt(b.title);
      const cmp = [["Titolo", it.name, b.title], ["Autore", it.fields.autore || "—", b.authors || "—"], ["Anno", it.fields.anno || "—", b.year || "—"]];
      if (t1 && t2 && !t1.includes(t2.split(" ").slice(0, 2).join(" ")) && !t2.includes(t1.split(" ").slice(0, 2).join(" "))) add(it, "isbn:title", "warn", "L'ISBN corrisponde a \"" + b.title + "\".", { cmp, fix: { type: "name", v: b.title, label: "Usa il titolo del catalogo" }, srcName: "Google Books" });
      else if (it.fields.autore && b.authors) {
        const a1 = normTxt(it.fields.autore).split(" "), a2 = normTxt(b.authors).split(" ");
        if (!a1.some(w => w.length > 2 && a2.includes(w))) add(it, "isbn:author", "warn", "Per questo ISBN l'autore risulta " + b.authors + ".", { cmp, fix: { type: "fields", set: { autore: b.authors }, label: "Applica l'autore" }, srcName: "Google Books" });
      }
    });
    R.cat = { at: nowIso(), issues: out, nCards, nBooks };
    lsSet("col.revCat", { at: R.cat.at, nCards, nBooks });
    toast(out.length ? out.length + " segnalazioni dai cataloghi" : "Nessuna differenza con i cataloghi", 4000);
  } catch (e) { toast("Confronto interrotto: " + (e.message || "errore di rete"), 5000); }
  R.catBusy = false; R.catMsg = "";
  reviewPrepPack();
  render();
}

/* --- correzioni --- */
async function reviewApply(uid) {
  const x = reviewAll().find(y => y.uid === uid);
  if (!x || !x.fix) return;
  try {
    if (x.fix.type === "merge") {
      const list = x.fix.ids.map(id => S.items.get(id)).filter(Boolean);
      const keep = Object.assign({}, list[0]);
      keep.qty = list.reduce((a, i) => a + (Number(i.qty) || 0), 0);
      keep.photos = [...new Set(list.flatMap(i => i.photos || []))];
      keep.movements = list.flatMap(i => i.movements || []);
      const notes = list.map(i => i.notes).filter(Boolean); if (notes.length) keep.notes = [...new Set(notes)].join("\n");
      const rest = list.slice(1).map(i => Object.assign({}, i, { deleted: true }));
      await saveItems([keep, ...rest]);
      toast("Schede unite");
    } else {
      const it = Object.assign({}, S.items.get(x.itemId));
      if (x.fix.type === "name") it.name = x.fix.v;
      else it.fields = Object.assign({}, it.fields || {}, x.fix.set);
      await saveItem(it);
      toast("Corretto");
    }
    reviewDropCat(uid);
    reviewRefresh(); reviewAfterAct(uid);
  } catch (e) { toast(dbErr(e), 4500); }
}
async function reviewIgnore(uid) {
  const x = reviewAll().find(y => y.uid === uid);
  if (!x || x.agg) return;
  try {
    const ids = x.dupIds || [x.itemId];
    const list = ids.map(id => { const it = Object.assign({}, S.items.get(id)); it.reviewIgnore = [...new Set([...(it.reviewIgnore || []), x.key])]; return it; });
    await saveItems(list);
    reviewDropCat(uid);
    reviewRefresh(); reviewAfterAct(uid);
  } catch (e) { toast(dbErr(e), 4500); }
}
function reviewDropCat(uid) { const R = S.review; if (R.cat) R.cat.issues = R.cat.issues.filter(y => y.uid !== uid); }
function reviewAfterAct(uid) {
  if (S.view.name === "reviewItem") {
    const list = S.view.list || [];
    const i = list.indexOf(uid);
    const live = new Set(reviewAll().map(y => y.uid));
    const next = list.slice(i + 1).find(u => live.has(u)) || list.slice(0, i).reverse().find(u => live.has(u));
    if (next) { S.view.uid = next; render(); window.scrollTo(0, 0); } else back();
    return;
  }
  render();
}

async function raiRun() {

  if (!list.length) return;
  let lim = null;
  try { lim = await S.sample.limits(); } catch (e) { }
  const maxImg = lim && lim.images ? Math.max(1, lim.images.maxCount || 1) : 0;
  r.step = "run"; r.pct = 5; r.msg = "Preparo i pezzi"; r.status = ""; r.results = []; r.showOk = false; render();

        try { const bl = await getPhotoBlob(pid); if (bl) { images.push(await compressImage(bl, 900, 0.8)); photoOf[it.id] = images.length; } } catch (e) { }
      }
      const so = { signal: r.ctl.signal, cache: false };
      if (images.length) so.images = images;
      if (tools) so.tools = tools;
      let arr = [];
      try { const out = await S.sample.json(raiPrompt(lot, !!tools, photoOf), so); arr = Array.isArray(out) ? out : []; }
      catch (e) { if (e && e.code === "cancelled") break; toast(sampleErr(e), 5000); if (e && ["not_granted", "sampling_disabled", "rate_limited", "session_expired"].includes(e.code)) break; continue; }

        const esito = ["ok", "controlla", "non_verificabile"].includes(o.esito) ? o.esito : "non_verificabile";
        const c = cat(it.catId);
        const corr = {};
        Object.entries(o.correzioni || {}).forEach(([k, v]) => {
          if (v == null || v === "") return;
          if (k === "nome") { corr.nome = String(v).slice(0, 160); return; }
          const f = c.fields.find(y => y.k === k); if (!f) return;
          if (f.type === "select" && f.options.length && !f.options.includes(String(v))) return;
          corr[k] = f.type === "number" ? (parseNum(String(v)) ?? null) : f.type === "bool" ? !!v : String(v).slice(0, 200);
          if (corr[k] == null) delete corr[k];
        });
        const res = { id: it.id, esito, nota: String(o.nota || "").slice(0, 300), corr };
        r.results.push(res);
        const n = Object.assign({}, it, { reviewedAt: today(), reviewRes: esito, reviewNote: res.nota });
        upd.push(n);
      });
      if (upd.length) { try { await saveItems(upd); } catch (e) { } }
    }
  } finally {
    r.step = r.results.length ? "done" : "pick";
    if (!r.results.length) toast("Nessun risultato dalla verifica.", 4000);

    render(); window.scrollTo(0, 0);
  }
}

async function startCamera() {
  const st = $("bc_status");
  const say = t => { if (st) st.textContent = t; };
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { say("Fotocamera non disponibile: scrivi il numero qui sotto."); return; }
  try {
    BC.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }, audio: false });
    const v = $("bc_video"); if (!v) { stopCamera(); return; }
    v.srcObject = BC.stream; await v.play();
  } catch (e) { say("Non posso usare la fotocamera (permesso negato?): scrivi il numero qui sotto."); return; }
  if (!("BarcodeDetector" in window)) { say("Questo browser non legge i codici dalla fotocamera: scrivi il numero qui sotto."); return; }
  try {
    const want = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "isbn" ];
    let fm = want;
    try { const sup = await BarcodeDetector.getSupportedFormats(); fm = want.filter(f => sup.includes(f)); } catch (e) { }
    BC.det = new BarcodeDetector({ formats: fm.length ? fm : undefined });
  } catch (e) { say("Lettore di codici non disponibile: scrivi il numero qui sotto."); return; }
  say("Inquadra il codice a barre nel riquadro.");
  BC.timer = setInterval(async () => {
    const v = $("bc_video"); if (!v || !BC.det || S.bc.busy) return;
    try { const r = await BC.det.detect(v); if (r && r.length && r[0].rawValue) { S.bc.busy = true; onBarcode(String(r[0].rawValue).trim()); } } catch (e) { }
  }, 300);
}
function cleanCode(c) { return String(c || "").replace(/[^0-9Xx]/g, "").toUpperCase(); }
function isIsbn(c) { return /^(97[89])\d{10}$/.test(c) || /^\d{9}[\dX]$/.test(c); }
async function onBarcode(raw) {
  stopCamera();
  const code = cleanCode(raw) || String(raw).trim();
  const res = $("bc_result"); const st = $("bc_status");
  if (st) st.textContent = "Codice letto: " + code;
  const dups = [...S.items.values()].filter(i => !i.deleted && (i.barcode === code || (i.fields && cleanCode(i.fields.isbn) === code)));
  if (dups.length) {
    const d = dups[0];

async function lookupBook(isbn) {
  try {
    const d = await getJson("https://www.googleapis.com/books/v1/volumes?q=isbn:" + isbn);
    const v = d && d.items && d.items[0] && d.items[0].volumeInfo;
    if (v) return { title: v.title + (v.subtitle ? ": " + v.subtitle : ""), authors: (v.authors || []).join(", "), publisher: v.publisher || "", year: (v.publishedDate || "").slice(0, 4), cover: v.imageLinks ? String(v.imageLinks.thumbnail || v.imageLinks.smallThumbnail || "").replace(/^http:/, "https:") : "" };
  } catch (e) { }
  try {
    const d = await getJson("https://openlibrary.org/api/books?bibkeys=ISBN:" + isbn + "&format=json&jscmd=data");
    const v = d && d["ISBN:" + isbn];
    if (v) return { title: v.title + (v.subtitle ? ": " + v.subtitle : ""), authors: (v.authors || []).map(a => a.name).join(", "), publisher: (v.publishers || []).map(p => p.name).join(", "), year: String(v.publish_date || "").match(/\d{4}/) ? String(v.publish_date).match(/\d{4}/)[0] : "", cover: v.cover ? (v.cover.medium || v.cover.small || "") : "" };
  } catch (e) { }
  return null;
}
async function bcCreate(code) {
  const b = S.bc; const c = cat(b.catId);
  const st = $("bc_status");
  const d = newDraft(b.catId, "in");
  d.barcode = code;
  let found = false;
  if (isIsbn(code)) {
    if (st) st.textContent = "Cerco il libro…";
    const bk = await lookupBook(code);
    if (bk) {
      found = true;
      d.name = bk.title || "";
      const has = k => c && c.fields.some(f => f.k === k);
      if (has("autore")) d.fields.autore = bk.authors;
      if (has("editore")) d.fields.editore = bk.publisher;
      if (has("anno") && bk.year) d.fields.anno = Number(bk.year);
      if (has("isbn")) d.fields.isbn = code;
      if (bk.cover) { d.imageUrl = bk.cover; }
    }
  }
  closeModal(); stopCamera();

  go({ name: "itemForm", focus: "f_name" });
  toast(found ? "Dati trovati: controlla e salva" : (isIsbn(code) ? "Libro non trovato negli archivi: completa a mano" : "Codice salvato: scrivi il titolo"), 4500);
}

/* ================= Azioni categorie ================= */
async function saveCat() {
  readCatForm();
  const d = S.catDraft;
  if (!d.name) { toast("Dai un nome alla categoria."); return; }
  const fields = [];
  const keys = [];
  for (const f of d.fields) {
    if (!String(f.label || "").trim()) continue;
    const k = f.k || fieldKey(f.label, keys);
    keys.push(k);
    fields.push({ k, label: f.label.trim(), type: f.type || "text", options: f.type === "select" ? (f.options || []) : [] });
  }
  const cfg = JSON.parse(JSON.stringify(S.config || { groups: [], cats: [] }));
  const body = { id: d.id || slug(d.name), name: d.name, group: d.group || null, icon: d.icon || "box", consumable: !!d.consumable, cond: d.cond.length ? d.cond : ["Nuovo", "Ottimo", "Buono", "Discreto", "Rovinato"], fields, order: d.order != null ? d.order : (cfg.cats.length + cfg.groups.length) * 10 + 10 };
  const ix = cfg.cats.findIndex(c => c.id === body.id);
  if (ix >= 0) cfg.cats[ix] = body; else cfg.cats.push(body);
  try { await saveConfig(cfg); S.config = normConfig(cfg); syncSubs(); toast("Categoria salvata"); back(); } catch (e) { toast(dbErr(e)); }
}
async function delCat() {
  const d = S.catDraft;
  const n = catItems(d.id).length;
  if (n) { toast("La categoria contiene " + n + " pezzi: spostali o eliminali prima.", 4500); return; }
  if (!(await confirmBox("Eliminare la categoria?", "La categoria " + d.name + " verrà rimossa.", "Elimina", true))) return;
  const cfg = JSON.parse(JSON.stringify(S.config));
  cfg.cats = cfg.cats.filter(c => c.id !== d.id);
  try { await saveConfig(cfg); S.config = normConfig(cfg); syncSubs(); back(); } catch (e) { toast(dbErr(e)); }
}
async function moveCat(id, dir) {
  const cfg = JSON.parse(JSON.stringify(S.config));
  const c = cfg.cats.find(x => x.id === id);
  const sibs = cfg.cats.filter(x => (x.group || null) === (c.group || null)).sort((a, b) => (a.order || 0) - (b.order || 0));
  const ix = sibs.indexOf(c), j = ix + dir;
  if (j < 0 || j >= sibs.length) return;
  [sibs[ix], sibs[j]] = [sibs[j], sibs[ix]];
  sibs.forEach((s, k) => { s.order = (k + 1) * 10 + (c.group ? 0 : 1000); });
  try { await saveConfig(cfg); S.config = normConfig(cfg); render(); } catch (e) { toast(dbErr(e)); }
}
async function saveGroup() {
  const d = S.groupDraft; d.name = val("g_name").trim();
  if (!d.name) { toast("Dai un nome al gruppo."); return; }
  const cfg = JSON.parse(JSON.stringify(S.config || { groups: [], cats: [] }));

  const ix = cfg.groups.findIndex(g => g.id === body.id);
  if (ix >= 0) cfg.groups[ix] = body; else cfg.groups.push(body);
  try { await saveConfig(cfg); S.config = normConfig(cfg); toast("Gruppo salvato"); back(); } catch (e) { toast(dbErr(e)); }
}
async function delGroup() {
  const d = S.groupDraft;
  if (!(await confirmBox("Eliminare il gruppo?", "Le sue categorie resteranno, senza gruppo.", "Elimina", true))) return;

async function getJson(url, opts) {
  const r = await fetch(url, Object.assign({ headers: { Accept: "application/json" } }, opts || {}));
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("HTTP " + r.status);

}
function cacheGet(k, maxAgeMs) { const v = lsGet("col.cache." + k, null); return v && Date.now() - v.t < maxAgeMs ? v.d : null; }

/* --- elenco set --- */
async function loadSets(src, lang) {
  const key = src + ":" + lang;
  if (CAT_CACHE.sets[key]) return CAT_CACHE.sets[key];
  let sets = cacheGet("sets." + key, 3 * 864e5);
  if (!sets) {
    if (src === "tcgdex") {
      const d = await getJson("https://api.tcgdex.net/v2/" + lang + "/sets") || [];
      sets = d.map(x => ({ id: x.id, name: x.name, total: (x.cardCount && (x.cardCount.official || x.cardCount.total)) || null, logo: x.logo ? x.logo + ".png" : (x.symbol ? x.symbol + ".png" : null) })).reverse();
    } else {
      const d = await getJson("https://api.scryfall.com/sets");
      const skip = new Set(["token", "memorabilia", "alchemy", "minigame", "vanguard", "treasure_chest"]);
      sets = ((d && d.data) || []).filter(x => !x.digital && !skip.has(x.set_type) && x.card_count > 0)
        .sort((a, b) => (b.released_at || "").localeCompare(a.released_at || ""))
        .map(x => ({ id: x.code, name: x.name, total: x.card_count, logo: x.icon_svg_uri || null, date: x.released_at || "" }));
    }
    cacheSet("sets." + key, sets);
  }
  CAT_CACHE.sets[key] = sets;
  return sets;

async function setAddGo(btn) {

async function cardPriceOne(id) {

const LOCAL = { idb: null, urls: new Map(), loading: new Set() };
const BLANK = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("collezioni", 1);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains("docs")) d.createObjectStore("docs"); if (!d.objectStoreNames.contains("blobs")) d.createObjectStore("blobs"); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbTx(store, mode, fn) {
  return LOCAL.idb.then(d => new Promise((res, rej) => {
    const tx = d.transaction(store, mode); const st = tx.objectStore(store);
    let out; const rq = fn(st); if (rq) rq.onsuccess = () => { out = rq.result; };
    tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  }));
}
function deepMerge(a, b) {
  for (const k of Object.keys(b)) {
    const v = b[k];
    if (v && typeof v === "object" && !Array.isArray(v) && a[k] && typeof a[k] === "object" && !Array.isArray(a[k])) deepMerge(a[k], v);
    else a[k] = v === undefined ? null : JSON.parse(JSON.stringify(v));
  }
  return a;
}
function makeLocalDb() {

  const subs = new Set();

  const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));
  const snap = p => ({ id: p.split("/").pop(), exists: mem.has(p), data: () => clone(mem.get(p)), metadata: { fromCache: false, hasPendingWrites: false } });
  const notify = p => setTimeout(() => subs.forEach(s => { if (s.match(p)) s.f(); }), 0);
  const persist = p => mem.has(p) ? idbTx("docs", "readwrite", st => st.put(mem.get(p), p)) : idbTx("docs", "readwrite", st => st.delete(p));
  const doc = p => ({
    path: p, id: p.split("/").pop(),
    get: async () => { await ready; return snap(p); },
    set: async d => { await ready; mem.set(p, clone(d)); await persist(p); notify(p); },
    update: async d => { await ready; if (!mem.has(p)) throw { code: "invalid_argument", message: "documento inesistente" }; deepMerge(mem.get(p), d); await persist(p); notify(p); },
    delete: async () => { await ready; mem.delete(p); await persist(p); notify(p); },
    onSnapshot: (next) => { const s = { match: q => q === p, f: () => next(snap(p)) }; subs.add(s); ready.then(s.f); return () => subs.delete(s); }
  });
  const collection = p => {
    const depth = p.split("/").length + 1;
    const list = () => [...mem.keys()].filter(k => k.startsWith(p + "/") && k.split("/").length === depth).sort().map(snap);
    return {
      path: p, doc: id => doc(p + "/" + id),
      get: async () => { await ready; const d = list(); return { docs: d, size: d.length, empty: !d.length }; },
      onSnapshot: (next) => { const s = { match: q => q.startsWith(p + "/") && q.split("/").length === depth, f: () => { const d = list(); next({ docs: d, size: d.length, empty: !d.length, docChanges: () => [] }); } }; subs.add(s); ready.then(s.f); return () => subs.delete(s); }
    };

}
function makeLocalAssets() {
  return {
    upload: async blob => { const id = uid("p"); await idbTx("blobs", "readwrite", st => st.put(blob, id)); LOCAL.urls.set(id, URL.createObjectURL(blob)); return { id, url: LOCAL.urls.get(id) }; },
    list: async () => { const keys = await idbTx("blobs", "readonly", st => st.getAllKeys()); return { assets: (keys || []).map(id => ({ id })) }; },
    delete: async id => idbTx("blobs", "readwrite", st => st.delete(id))
  };
}
function makeLocalDownloads() {

      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    }
  };
}
function photoSrc(id) {

}
